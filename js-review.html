<script>
  // "Review" engine: the Learn scheduler with an optimistic prior. Where Learn
  // assumes every card is unknown, Review assumes every card is already
  // learned: unseen cards enter play with stability at the graduation bar, so
  // a correct answer confirms the prior and graduates the card on the spot —
  // get everything right and the session is a single shuffled pass. A miss
  // resets stability just like any Learn miss, dropping that card into the
  // normal spaced-repetition schedule until it re-earns graduation.

  function ReviewState(cards) {
    var state = new LearnState(cards);
    state.priorS = state.graduationBar;
    return state; // a constructor returning an object makes `new` yield it
  }
</script>
