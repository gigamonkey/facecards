<script>
  // Build the student photo-card DOM shared by the home grid and study modes.

  function thumbUrl(fileId, size) {
    return (
      'https://drive.google.com/thumbnail?id=' +
      encodeURIComponent(fileId) +
      '&sz=w' +
      (size || 400)
    );
  }

  // opts.nameWithFirst: nickname line reads "Nick (First)" (study view).
  // opts.showNumber:    append the student-number line (home view).
  // opts.hideClass:     omit the course/period line (shared views, where a
  //                     student spans several classes).
  // opts.defer:         don't load the photo yet — show a "Loading…" box that
  //                     loadCardImage swaps for the proxied photo when the card
  //                     is shown (study mode), so the answer stays hidden.
  // Mirrors views/index.njk and views/study.njk.
  function initials(s) {
    return ((s.firstName || '').charAt(0) + (s.lastName || '').charAt(0)).toUpperCase();
  }

  function buildCard(s, opts) {
    opts = opts || {};
    var card = el('div', 'card');

    if (!s.fileId) {
      card.appendChild(el('div', 'initials', initials(s))); // no photo → initials box
    } else if (opts.defer) {
      card.appendChild(loadingBox(s.fileId)); // study — swapped for the photo on show
    } else {
      var img = el('img');
      img.alt = (s.firstName || '') + ' ' + (s.lastName || '');
      img.loading = 'lazy';
      img.src = thumbUrl(s.fileId, 400);
      card.appendChild(img);
    }

    var back = el('div', 'back');
    var nameText = s.nickname
      ? opts.nameWithFirst
        ? s.nickname + ' (' + s.firstName + ')'
        : s.nickname
      : s.firstName;
    back.appendChild(el('p', 'name', nameText));
    back.appendChild(el('p', null, (s.firstName || '') + ' ' + (s.lastName || '')));
    back.appendChild(el('p', null, (s.grade || '') + ' / ' + (s.gender || '')));
    if (!opts.hideClass) {
      back.appendChild(el('p', null, (s.course || '') + ' - Period ' + (s.period || '')));
    }
    if (opts.showNumber) back.appendChild(el('p', null, String(s.studentNumber)));
    card.appendChild(back);

    return card;
  }

  // A "Loading…" placeholder for a deferred photo; loadCardImage swaps it for
  // the real image once fetched.
  function loadingBox(fileId) {
    var box = el('div', 'loading', 'Loading…');
    box.dataset.fileid = fileId;
    return box;
  }

  // Photos fetched through the script are held in memory by fileId, so card
  // repeats (Leitner, review re-runs) don't refetch within a session.
  var PHOTO_CACHE = {};

  function hasServer() {
    return typeof google !== 'undefined' && google.script && google.script.run;
  }

  // When a deferred card is shown, replace its "Loading…" box with the photo,
  // fetched via google.script.run so it works where the browser blocks
  // cross-site Drive cookies (e.g. Safari on mobile). Cached by fileId.
  function loadCardImage(card) {
    if (!card) return;
    var box = card.querySelector('.loading');
    if (!box || !box.dataset || !box.dataset.fileid) return;
    var fileId = box.dataset.fileid;
    delete box.dataset.fileid;

    function swap(dataUrl) {
      if (!dataUrl || !box.parentNode) return;
      var img = el('img');
      img.src = dataUrl;
      box.parentNode.replaceChild(img, box);
    }

    if (PHOTO_CACHE[fileId]) {
      swap(PHOTO_CACHE[fileId]);
      return;
    }
    if (!hasServer()) return;
    google.script.run
      .withSuccessHandler(function (dataUrl) {
        if (dataUrl) PHOTO_CACHE[fileId] = dataUrl;
        swap(dataUrl);
      })
      .getPhoto(fileId);
  }

  // Warm the cache in the background, one request at a time, so cards are
  // usually ready before they're reached.
  function preloadPhotos(fileIds) {
    if (!hasServer()) return;
    var i = 0;
    function next() {
      while (i < fileIds.length && (!fileIds[i] || PHOTO_CACHE[fileIds[i]])) i++;
      if (i >= fileIds.length) return;
      var fileId = fileIds[i++];
      google.script.run
        .withSuccessHandler(function (dataUrl) {
          if (dataUrl) PHOTO_CACHE[fileId] = dataUrl;
          next();
        })
        .withFailureHandler(function () {
          next();
        })
        .getPhoto(fileId);
    }
    next();
  }
</script>
