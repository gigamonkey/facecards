<script>
  // "Learn" engine: probabilistic spaced repetition via a per-card forgetting
  // curve. Each card carries a stability s (a half-life measured in cards
  // asked, not wall-clock time) and the trial number at which it was last
  // shown. The predicted chance the student still recalls a card t trials
  // after seeing it is R = 2^(-t/s), so its urgency -- the chance it has been
  // forgotten -- is w = 1 - R. The next card is drawn at random with
  // probability proportional to w.
  //
  // The bookkeeping falls out of the decay function: showing a card resets
  // t to 0, so its urgency drops to nothing and climbs back on its own. A
  // correct answer multiplies s by 1 + GROWTH * (1 - R): the more forgotten
  // the card was when it was asked, the more the correct answer proves, so
  // the more its stability grows. (Answering while the card is still fresh
  // proves little, so a card can only graduate by surviving real gaps.) A
  // miss resets s to the starting value, so the card reasserts itself soon.
  // New cards are dealt in only when no already-seen card is urgent enough
  // -- which also means that when every active card is still fresh, the pool
  // grows instead of re-asking too early, and gaps stretch on their own. A
  // card graduates out of the session once s reaches the graduation bar
  // (GRADUATED_S, capped only for tiny decks that can't produce gaps that
  // long). Once the deck is exhausted, the same not-urgent-enough gate deals
  // already-graduated cards back in as spacers, so the last stragglers still
  // get real gaps instead of being drilled back-to-back -- and missing a
  // spacer un-graduates it. The session ends when every card has graduated.

  // The knobs below are documented in TUNING.md.
  var LEARN_START_S = 1; // stability of a new or just-missed card
  var LEARN_GROWTH = 3; // stability multiplier is 1 + this * (1 - R)
  var LEARN_GRADUATED_S = 16; // stability at which a card leaves the session
  // Deal a new card only when nothing in play is as urgent as a just-missed
  // card is one trial after the miss. Defined that way (rather than as a bare
  // number) so a fresh miss always blocks new material: the very next card is
  // existing material, and the missed card follows close behind.
  var LEARN_INTRODUCE_BELOW = 1 - Math.pow(2, -1 / LEARN_START_S);

  function LearnState(cards) {
    this.unseen = shuffled(cards);
    this.active = []; // seen but not yet graduated
    this.graduated = [];
    this.total = cards.length;
    this.remaining = cards.length; // active + unseen
    this.trial = 0;
    this.lastCard = null;
    this.missed = []; // cards missed at least once, for the done-screen drills
    this.memory = new Map(); // card -> { s, askedAt, askedW }
    // Stability a card enters play with. Review mode overrides this with the
    // graduation bar (an optimistic prior: "you probably know these"), so a
    // correct first answer graduates the card on the spot while a miss drops
    // it into the normal schedule.
    this.priorS = LEARN_START_S;
    // Where next() finds a spacer when the just-answered card is the only
    // active card: Learn re-shows a graduated card, so a miss never pulls in
    // new material; Review overrides this to deal from the deck, since its
    // prior says unseen cards are already known -- better spacers than cards
    // just confirmed.
    this.spacersFromDeck = false;
    // A deck can't produce gaps longer than the number of other cards in it.
    this.graduationBar = Math.min(
      LEARN_GRADUATED_S,
      Math.max(2 * LEARN_START_S, 2 * (cards.length - 1)),
    );
  }

  // A card retired in an earlier session (per saved progress) enters play
  // already graduated: it can be dealt back in as a spacer, and missing it
  // un-graduates it like any other spacer.
  LearnState.prototype.restore = function (card) {
    var i = this.unseen.indexOf(card);
    if (i === -1) return;
    this.unseen.splice(i, 1);
    this.memory.set(card, { s: this.graduationBar, askedAt: 0, askedW: 0 });
    this.graduated.push(card);
    this.remaining--;
  };

  LearnState.prototype.urgency = function (card) {
    var m = this.memory.get(card);
    return 1 - Math.pow(2, -(this.trial - m.askedAt) / m.s);
  };

  LearnState.prototype.deal = function (card) {
    var m = this.memory.get(card);
    if (m) {
      m.askedW = this.urgency(card); // how forgotten it was when asked
      m.askedAt = this.trial;
    } else {
      // A brand-new card is maximally unknown; a correct first answer means
      // the teacher already knows this student, so let it fast-track out.
      this.memory.set(card, { s: this.priorS, askedAt: this.trial, askedW: 1 });
      this.active.push(card);
    }
    this.trial++;
    this.lastCard = card;
    return card;
  };

  // Draw from cards (excluding the card just answered) with probability
  // proportional to urgency; null if there's nothing to draw.
  LearnState.prototype.sample = function (cards) {
    var self = this;
    var candidates = cards.filter(function (c) {
      return c !== self.lastCard;
    });
    var total = 0;
    var weights = candidates.map(function (c) {
      var w = self.urgency(c);
      total += w;
      return w;
    });
    var r = Math.random() * total;
    for (var i = 0; i < candidates.length; i++) {
      r -= weights[i];
      if (r < 0) return candidates[i];
    }
    return candidates.length > 0 ? candidates[candidates.length - 1] : null;
  };

  LearnState.prototype.next = function () {
    if (this.remaining === 0) return null;

    // The gate counts every active card, including the one just answered: a
    // just-missed card is urgent even though it can't be re-dealt yet, so it
    // holds new material back while the sampler fills the gap with an
    // existing card.
    var self = this;
    var maxW = this.active.reduce(function (max, c) {
      return Math.max(max, self.urgency(c));
    }, 0);

    // Nothing in play is urgent enough: bring in a new card, or once the
    // deck is empty, a graduated card as a spacer.
    if (maxW < LEARN_INTRODUCE_BELOW) {
      if (this.unseen.length > 0) return this.deal(this.unseen.pop());
      var spacer = this.sample(this.graduated);
      if (spacer) return this.deal(spacer);
    }

    // Re-ask an active card (never the one just answered). When the card
    // just answered is the only active card, fall back to anything else in
    // play -- per spacersFromDeck, a graduated spacer or a new card --
    // before re-dealing it back-to-back.
    var pick = this.sample(this.active);
    if (!pick && this.spacersFromDeck && this.unseen.length > 0)
      pick = this.unseen.pop();
    if (!pick) pick = this.sample(this.graduated);
    if (!pick && this.unseen.length > 0) pick = this.unseen.pop();
    return this.deal(pick || this.lastCard);
  };

  LearnState.prototype.correct = function (card) {
    var m = this.memory.get(card);
    m.s *= 1 + LEARN_GROWTH * m.askedW;
    var i = this.active.indexOf(card);
    if (i !== -1 && m.s >= this.graduationBar) {
      this.active.splice(i, 1);
      this.graduated.push(card);
      this.remaining--;
    }
  };

  LearnState.prototype.incorrect = function (card) {
    this.memory.get(card).s = LEARN_START_S;
    if (this.missed.indexOf(card) === -1) this.missed.push(card);
    // A missed spacer wasn't learned after all: un-graduate it.
    var i = this.graduated.indexOf(card);
    if (i !== -1) {
      this.graduated.splice(i, 1);
      this.active.push(card);
      this.remaining++;
    }
  };

  LearnState.prototype.doneMessage = function () {
    // A deck fully retired by saved progress ends before a card is dealt.
    if (this.trial === 0) return 'Everyone already learned!';
    return 'Done!' + (this.missed.length === 0 ? ' Perfect run!' : '');
  };
</script>
