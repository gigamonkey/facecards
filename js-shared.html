<script>
  // Render the ?shared-with= table: students the current teacher shares with
  // another teacher — photo, info, your class(es), their class(es).
  function renderShared(container, shared) {
    container.innerHTML = '';
    var wrap = el('div');
    wrap.id = 'shared';

    if (!shared || !shared.resolved) {
      wrap.appendChild(
        el('p', null, 'No teacher found matching “' + (shared ? shared.param : '') + '”.'),
      );
      container.appendChild(wrap);
      return;
    }

    wrap.appendChild(el('h1', null, 'Shared with ' + (shared.otherLast || shared.otherFull)));

    if (!shared.students.length) {
      wrap.appendChild(el('p', null, 'No shared students.'));
      container.appendChild(wrap);
      return;
    }

    var table = el('table', 'shared-table');

    var thead = el('thead');
    var htr = el('tr');
    ['', 'Student', shared.meFull, shared.otherFull].forEach(function (h) {
      htr.appendChild(el('th', null, h));
    });
    thead.appendChild(htr);
    table.appendChild(thead);

    var tbody = el('tbody');
    shared.students.forEach(function (s) {
      var tr = el('tr');

      var tdPhoto = el('td', 'photo');
      if (s.fileId) {
        var img = el('img');
        img.loading = 'lazy';
        img.alt = (s.firstName || '') + ' ' + (s.lastName || '');
        img.src = thumbUrl(s.fileId, 200);
        tdPhoto.appendChild(img);
      } else {
        tdPhoto.appendChild(el('div', 'initials', initials(s)));
      }
      tr.appendChild(tdPhoto);

      var tdInfo = el('td', 'info');
      tdInfo.appendChild(
        el('p', 'name', s.nickname ? s.nickname + ' (' + s.firstName + ')' : s.firstName),
      );
      tdInfo.appendChild(el('p', null, (s.firstName || '') + ' ' + (s.lastName || '')));
      tdInfo.appendChild(el('p', null, (s.grade || '') + ' / ' + (s.gender || '')));
      tdInfo.appendChild(el('p', null, String(s.studentNumber)));
      tr.appendChild(tdInfo);

      tr.appendChild(classesCell(s.mine));
      tr.appendChild(classesCell(s.other));

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);

    container.appendChild(wrap);
  }

  function classesCell(names) {
    var td = el('td', 'classes');
    (names || []).forEach(function (n) {
      td.appendChild(el('p', null, n));
    });
    return td;
  }

  // Render the ?shared overview (the Shared landing page, all devices): a
  // table with one row per teacher the viewer shares students with — their
  // staff photo (or initials) in the first column, linking to their
  // ?shared-with= page, and their name, courses, and shared-student count in
  // the second.
  function renderSharedOverview(container, data) {
    container.innerHTML = '';
    var wrap = el('div');
    wrap.id = 'shared-overview';

    var baseUrl = (window.CTX && CTX.baseUrl) || '';

    wrap.appendChild(el('h1', null, 'Shared students'));

    if (!data || !data.teachers.length) {
      wrap.appendChild(el('p', null, 'You don’t share any students with another teacher.'));
      container.appendChild(wrap);
      return;
    }

    var table = el('table', 'shared-overview-table');
    var tbody = el('tbody');
    data.teachers.forEach(function (t) {
      var href = appUrl('?shared-with=' + encodeURIComponent(t.key));
      var name = t.full || t.last || t.key;
      var tr = el('tr');

      var tdPhoto = el('td', 'photo');
      var photoLink = el('a');
      photoLink.href = href;
      if (baseUrl) photoLink.target = '_top';
      photoLink.setAttribute('aria-label', 'Students shared with ' + name);
      if (t.photoUrl) {
        var img = el('img');
        img.alt = '';
        img.loading = 'lazy';
        img.src = t.photoUrl;
        photoLink.appendChild(img);
      } else {
        photoLink.appendChild(el('div', 'initials', teacherInitials(t)));
      }
      tdPhoto.appendChild(photoLink);
      tr.appendChild(tdPhoto);

      var tdInfo = el('td', 'info');
      var nameP = el('p', 'name');
      var nameLink = el('a', null, name);
      nameLink.href = href;
      if (baseUrl) nameLink.target = '_top';
      nameP.appendChild(nameLink);
      tdInfo.appendChild(nameP);
      if (t.courses && t.courses.length) {
        tdInfo.appendChild(el('p', 'shared-courses', t.courses.join(', ')));
      }
      var n = (t.students || []).length;
      tdInfo.appendChild(el('p', 'count', n + ' shared student' + (n === 1 ? '' : 's')));
      tr.appendChild(tdInfo);

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);

    container.appendChild(wrap);
  }

  // First-and-last initials from a teacher's display name ("Sydney Aardal"
  // -> "SA"), for teachers with no staff photo.
  function teacherInitials(t) {
    var parts = String(t.full || t.last || t.key || '')
      .trim()
      .split(/\s+/);
    var first = (parts[0] || '').charAt(0);
    var last = parts.length > 1 ? parts[parts.length - 1].charAt(0) : '';
    return (first + last).toUpperCase();
  }

  // ---- Mobile shared UI ----


  // Mobile ?shared-with: browse the shared students one at a time, swiping
  // left (next) / right (previous). Shows photo, info, and both teachers'
  // classes. Photos load via the same proxy as study mode.
  function renderSharedSwipe(container, shared) {
    container.innerHTML = '';
    var wrap = el('div');
    wrap.id = 'shared-swipe';

    if (!shared || !shared.resolved) {
      wrap.appendChild(
        el('p', null, 'No teacher found matching “' + (shared ? shared.param : '') + '”.'),
      );
      container.appendChild(wrap);
      return;
    }

    wrap.appendChild(
      el('h1', null, 'Shared with ' + (shared.otherLast || shared.otherFull)),
    );

    var students = shared.students || [];
    if (!students.length) {
      wrap.appendChild(el('p', null, 'No shared students.'));
      container.appendChild(wrap);
      return;
    }

    runCarousel(
      wrap,
      students.map(function (s) {
        return buildSharedCard(s, shared);
      }),
    );
    preloadPhotos(
      students.map(function (s) {
        return s.fileId;
      }),
    );
    container.appendChild(wrap);
  }

  // One-at-a-time card carousel: a counter and a stage appended to wrap, swipe
  // left (next) / right (previous) on touch, arrow keys on a keyboard. Used by
  // the mobile shared-with view and by browse mode. Returns a teardown that
  // removes the document/window listeners — needed where the carousel is
  // entered without a page load (browse, from the home grid).
  function runCarousel(wrap, cards) {
    var counter = el('div', 'swipe-counter');
    wrap.appendChild(counter);
    var stage = el('div', 'swipe-stage');
    wrap.appendChild(stage);

    var idx = 0;

    function show(i) {
      idx = Math.max(0, Math.min(cards.length - 1, i));
      var card = cards[idx];
      loadCardImage(card);
      stage.replaceChildren(card);
      counter.textContent = idx + 1 + ' / ' + cards.length;
    }

    var startX = null;
    var startY = null;
    function onStart(e) {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }
    function onMove(e) {
      if (startX === null) return;
      var t = e.touches[0];
      // Horizontal intent: prevent the browser from scrolling/back-swiping and
      // cancelling the gesture (which would fire touchcancel, not touchend).
      if (Math.abs(t.clientX - startX) > Math.abs(t.clientY - startY)) {
        e.preventDefault();
      }
    }
    function onEnd(e) {
      if (startX === null) return;
      var dx = e.changedTouches[0].clientX - startX;
      startX = null;
      if (helpOpen()) return;
      if (Math.abs(dx) > 40) show(dx < 0 ? idx + 1 : idx - 1);
    }
    function onKey(e) {
      if (helpOpen()) return;
      if (e.key === 'ArrowRight') show(idx + 1);
      else if (e.key === 'ArrowLeft') show(idx - 1);
    }
    // Listen on the whole page (not just the card) so a swipe anywhere works.
    document.body.addEventListener('touchstart', onStart, { passive: true });
    document.addEventListener('touchmove', onMove, { passive: false });
    document.body.addEventListener('touchend', onEnd);
    document.body.addEventListener('touchcancel', onEnd);
    window.addEventListener('keydown', onKey);

    show(0);

    return function () {
      document.body.removeEventListener('touchstart', onStart);
      document.removeEventListener('touchmove', onMove);
      document.body.removeEventListener('touchend', onEnd);
      document.body.removeEventListener('touchcancel', onEnd);
      window.removeEventListener('keydown', onKey);
    };
  }

  function buildSharedCard(s, shared) {
    var card = el('div', 'swipe-card');

    if (!s.fileId) {
      card.appendChild(el('div', 'initials', initials(s)));
    } else {
      card.appendChild(loadingBox(s.fileId)); // proxy-loaded, swapped in when shown
    }

    var info = el('div', 'swipe-info');
    info.appendChild(
      el('p', 'name', s.nickname ? s.nickname + ' (' + s.firstName + ')' : s.firstName),
    );
    info.appendChild(el('p', null, (s.firstName || '') + ' ' + (s.lastName || '')));
    info.appendChild(el('p', null, (s.grade || '') + ' / ' + (s.gender || '')));
    info.appendChild(el('p', null, String(s.studentNumber)));
    card.appendChild(info);

    var classes = el('div', 'swipe-classes');
    classes.appendChild(classLine(shared.meFull, s.mine));
    classes.appendChild(classLine(shared.otherFull, s.other));
    card.appendChild(classes);

    return card;
  }

  function classLine(label, names) {
    var p = el('p');
    p.appendChild(el('strong', null, (label || '') + ': '));
    p.appendChild(document.createTextNode((names || []).join(', ')));
    return p;
  }
</script>
