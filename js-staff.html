<script>
  // Staff directory view: the scraped BHS staff (window.STAFF) as a filterable
  // face grid with Learn / Review / Browse over whatever the filter matches,
  // plus the staff flavors of the flashcard and browse card. Staff photos are
  // public bhs.berkeleyschools.net URLs, so cards use plain <img>s — none of
  // the Drive direct-vs-proxy machinery (no Google cookies involved, so they
  // load everywhere, mobile Safari included).

  // The current filter query. Module-global so leaving for a study session and
  // coming back keeps the filter, and so js-app's studentsFor/titleFor can
  // scope study to the filtered set.
  var staffFilterQuery = '';

  function staffList() {
    return (window.STAFF && window.STAFF.staff) || [];
  }

  // The staff matching the current filter: case-insensitive substring match on
  // name and role ("math", "sped", "safety", …). This is what makes study
  // usable — the full directory is far too many cards for one Learn session.
  function staffMatches() {
    var q = staffFilterQuery.trim().toLowerCase();
    return staffList().filter(function (p) {
      return !q || staffSearchText(p).indexOf(q) !== -1;
    });
  }

  function staffSearchText(p) {
    return (p.firstName + ' ' + p.lastName + ' ' + p.role).toLowerCase();
  }

  function renderStaff(container, onStudy) {
    container.innerHTML = '';
    var home = el('div');
    home.id = 'home'; // reuse the home-view grid layout and CSS

    if (!staffList().length) {
      home.appendChild(el('h1', 'teacher-name', 'BHS staff'));
      home.appendChild(
        el('p', null, 'No staff data yet — run refreshStaffDirectory() from the Apps Script editor.'),
      );
      container.appendChild(home);
      return;
    }

    home.appendChild(classHead('BHS staff', onStudy, 'staff', ''));

    // Everyone gets the link; the edit page itself explains if the viewer has
    // no directory entry to edit.
    var editLink = el('p', 'staff-edit-link');
    var edit = el('a', null, 'Edit my entry');
    edit.href = appUrl('?staff-edit');
    if ((window.CTX || {}).baseUrl) edit.target = '_top';
    editLink.appendChild(edit);
    home.appendChild(editLink);

    var filter = el('input', 'staff-filter');
    filter.type = 'search';
    filter.placeholder = 'Filter by name or role';
    filter.setAttribute('aria-label', 'Filter staff by name or role');
    filter.value = staffFilterQuery;
    home.appendChild(filter);

    var count = el('p', 'staff-count');
    home.appendChild(count);

    // Build every card once; filtering just toggles visibility.
    var faces = el('div', 'faces');
    var cards = staffList().map(function (p) {
      var card = buildStaffCard(p);
      attachFlip(card);
      faces.appendChild(card);
      return card;
    });
    home.appendChild(faces);

    function applyFilter() {
      staffFilterQuery = filter.value;
      var q = staffFilterQuery.trim().toLowerCase();
      var matched = 0;
      staffList().forEach(function (p, i) {
        var show = !q || staffSearchText(p).indexOf(q) !== -1;
        cards[i].style.display = show ? '' : 'none';
        if (show) matched++;
      });
      count.textContent = matched + ' of ' + staffList().length;
    }
    filter.addEventListener('input', applyFilter);
    applyFilter();

    // Admins can replace the directory data from a saved copy of the page.
    if ((window.CTX || {}).isAdmin) home.appendChild(buildStaffUploadForm());

    container.appendChild(home);
  }

  // Admin-only: rewrite the `staff` tab from an uploaded copy of the
  // directory page's HTML source — the no-tooling fallback for when the
  // site's firewall blocks Google's fetch servers and refreshStaffDirectory
  // 403s. The server rejects "Save Page As" copies (they rewrite the image
  // URLs); the page *source* keeps them.
  function buildStaffUploadForm() {
    var wrap = el('div', 'staff-upload');
    wrap.appendChild(el('h2', null, 'Update the directory'));
    wrap.appendChild(
      el(
        'p',
        'hint',
        'If refreshing from the directory site fails (its firewall sometimes ' +
          'blocks Google’s servers), bring the page here yourself: open ' +
          'view-source:https://bhs.berkeleyschools.net/staff/ in a browser, select ' +
          'all, copy, and paste it below — or save it and upload the file. This ' +
          'replaces all the staff data, though not anyone’s edits to their own entry.',
      ),
    );

    var form = el('form');
    var file = el('input');
    file.type = 'file';
    file.accept = '.html,.htm,text/html';
    form.appendChild(file);

    var textarea = el('textarea');
    textarea.placeholder = 'Or paste the page source here';
    form.appendChild(textarea);

    var button = el('button', null, 'Upload');
    button.type = 'submit';
    form.appendChild(button);
    wrap.appendChild(form);

    var status = el('p', 'staff-status');
    wrap.appendChild(status);

    function setStatus(msg, isError) {
      status.textContent = msg;
      status.classList.toggle('error', !!isError);
    }

    function send(html) {
      if (!html.trim()) {
        setStatus('Choose a saved file or paste the page source first.', true);
        return;
      }
      button.disabled = true;
      setStatus('Uploading…');
      google.script.run
        .withSuccessHandler(function (result) {
          button.disabled = false;
          // In place, no navigation (the sandbox blocks non-gesture
          // navigation) — the reload link is a real click.
          setStatus('Imported ' + result.saved + ' staff — ');
          var a = el('a', null, 'reload to see the changes');
          a.href = appUrl('?staff');
          if ((window.CTX || {}).baseUrl) a.target = '_top';
          status.appendChild(a);
          status.appendChild(document.createTextNode('.'));
        })
        .withFailureHandler(function (err) {
          button.disabled = false;
          setStatus(err.message, true);
        })
        .uploadStaffDirectory(html, asParam());
    }

    // The file wins if both are given (same rule as the lists form).
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (file.files && file.files.length) {
        var reader = new FileReader();
        reader.onload = function () {
          send(String(reader.result));
        };
        reader.onerror = function () {
          setStatus('Could not read that file.', true);
        };
        reader.readAsText(file.files[0]);
      } else {
        send(textarea.value);
      }
    });

    return wrap;
  }

  // A staff flashcard (grid and study modes): photo or initials front; first
  // name, full name, role, and username on the back.
  function buildStaffCard(p) {
    var card = el('div', 'card');
    card.appendChild(staffPhoto(p));

    var back = el('div', 'back');
    back.appendChild(el('p', 'name', p.firstName));
    back.appendChild(el('p', null, (p.firstName || '') + ' ' + (p.lastName || '')));
    if (p.role) back.appendChild(el('p', null, p.role));
    if (p.email) back.appendChild(el('p', null, staffUsername(p.email)));
    card.appendChild(back);

    return card;
  }

  // The photo (or initials box) for a staff card. Empty alt so a broken image
  // can't leak the name mid-study; the name is on the card anyway.
  function staffPhoto(p) {
    if (!p.photoUrl) return el('div', 'initials', initials(p));
    var img = el('img', 'staff-photo');
    img.alt = '';
    img.loading = 'lazy';
    img.src = p.photoUrl;
    return img;
  }

  function staffUsername(email) {
    return String(email).replace(/@berkeley\.net$/, '');
  }

  // Browse for staff: the same one-at-a-time carousel as student browse, with
  // everything visible. Model order (last name) — no re-sort, unlike students,
  // who browse by displayed first name.
  function renderStaffBrowse(container, title, staff) {
    container.innerHTML = '';
    var wrap = el('div');
    wrap.id = 'browse';
    wrap.appendChild(el('h1', null, title));

    var teardown = runCarousel(wrap, staff.map(buildStaffBrowseCard));
    preloadStaffPhotos(staff);
    container.appendChild(wrap);
    return teardown;
  }

  function buildStaffBrowseCard(p) {
    var card = el('div', 'swipe-card');
    card.appendChild(staffPhoto(p));

    var info = el('div', 'swipe-info');
    info.appendChild(el('p', 'name', (p.firstName || '') + ' ' + (p.lastName || '')));
    if (p.role) info.appendChild(el('p', null, p.role));
    if (p.email) info.appendChild(el('p', null, staffUsername(p.email)));
    card.appendChild(info);

    return card;
  }

  function preloadStaffPhotos(staff) {
    warmUrls(
      staff.map(function (p) {
        // Self-taken photos are data URLs — nothing to fetch.
        return p.photoUrl.indexOf('data:') === 0 ? '' : p.photoUrl;
      }),
      DIRECT_POOL,
    );
  }

  // The self-edit form (?staff-edit): correct your own directory entry. Saves
  // to the `staff overrides` tab via google.script.run, so a directory
  // re-scrape doesn't undo the fix. Photo editing is deliberately absent for
  // now. The viewer's entry is found by ctx.effective, so an admin editing
  // via ?as= sees and edits the impersonated person's entry.
  function renderStaffEdit(container) {
    container.innerHTML = '';
    var ctx = window.CTX || {};
    var wrap = el('div');
    wrap.id = 'staff-edit';

    var backLink = el('a', 'home-link', '← All staff');
    backLink.href = appUrl('?staff');
    if (ctx.baseUrl) backLink.target = '_top';
    wrap.appendChild(backLink);

    wrap.appendChild(el('h1', null, 'My staff entry'));

    var entry = myStaffEntry();
    if (!entry) {
      wrap.appendChild(
        el(
          'p',
          null,
          'No staff directory entry found for ' +
            staffUsername(ctx.effective || '') +
            '. Entries come from the BHS staff directory — contact Mr. Seibel if yours is missing.',
        ),
      );
      container.appendChild(wrap);
      return;
    }

    // One status line shared by the photo controls and the field form; it
    // sits below the form but everything needs it, so it's made first.
    var status = el('p', 'staff-status');

    function setStatus(msg, isError) {
      status.textContent = msg;
      status.classList.toggle('error', !!isError);
    }

    var photoSlot = el('div', 'staff-photo-slot');
    photoSlot.appendChild(staffPhoto(entry));
    wrap.appendChild(photoSlot);
    wrap.appendChild(buildPhotoTaker(entry, photoSlot, setStatus));

    var form = el('form');
    var firstName = editField(form, 'First name', entry.firstName, true);
    var lastName = editField(form, 'Last name', entry.lastName, true);
    var role = editField(form, 'Role', entry.role, false);

    var save = el('button', null, 'Save');
    save.type = 'submit';
    form.appendChild(save);
    wrap.appendChild(form);

    wrap.appendChild(status);

    // Always in the DOM; shown only while a field override exists. (A photo
    // override has its own Remove button by the photo.)
    var reset = el('button', 'staff-reset', 'Reset to directory values');
    reset.type = 'button';
    wrap.appendChild(reset);

    function showOverridden(on) {
      entry.overridden = on;
      reset.style.display = on ? '' : 'none';
    }
    showOverridden(entry.overridden);

    // Both handlers update the page in place — no navigation. Navigating from
    // an async success handler (window.top.location.href) gets silently
    // blocked by the sandbox ('allow-top-navigation-by-user-activation'):
    // by the time the server call returns, the click's user activation has
    // expired, so the form just hung on "Saving…". The ← All staff link is a
    // real click, so leaving still works.
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      save.disabled = true;
      setStatus('Saving…');
      var fields = { firstName: firstName.value, lastName: lastName.value, role: role.value };
      google.script.run
        .withSuccessHandler(function (result) {
          save.disabled = false;
          // Keep the client model in step so revisiting the form (or the
          // grid, within this page's lifetime) shows the saved values.
          entry.firstName = firstName.value = String(fields.firstName).trim();
          entry.lastName = lastName.value = String(fields.lastName).trim();
          entry.role = role.value = String(fields.role).trim();
          var overridden = !!(result && result.overridden);
          setStatus(overridden ? 'Saved.' : 'Saved — same as the directory, so nothing to override.');
          showOverridden(overridden);
        })
        .withFailureHandler(function (err) {
          save.disabled = false;
          setStatus(err.message, true);
        })
        .saveStaffOverride(fields, asParam());
    });

    reset.addEventListener('click', function () {
      if (!confirm('Discard your edits and go back to the directory values?')) return;
      reset.disabled = true;
      setStatus('Resetting…');
      google.script.run
        .withSuccessHandler(function (base) {
          reset.disabled = false;
          // The server sends back the scraped values so the form can show
          // them without a reload.
          if (base) {
            entry.firstName = firstName.value = base.firstName;
            entry.lastName = lastName.value = base.lastName;
            entry.role = role.value = base.role;
          }
          setStatus('Reset to the directory values.');
          showOverridden(false);
        })
        .withFailureHandler(function (err) {
          reset.disabled = false;
          setStatus(err.message, true);
        })
        .deleteStaffOverride(asParam());
    });

    wrap.appendChild(
      el(
        'p',
        'hint',
        'Your changes are stored separately from the directory, so they survive ' +
          'directory refreshes. Editing the entry for ' +
          staffUsername(ctx.effective || '') +
          '.',
      ),
    );

    container.appendChild(wrap);
  }

  // ---- Photo capture ------------------------------------------------------
  //
  // Take a replacement photo with the device camera, saved as a small JPEG
  // data URL in the overrides tab. The camera lifecycle, selfie mirroring,
  // and capture-crop approach are borrowed from gigamonkey/photobooth
  // (public/camera.js), cut down for this use: the preview is an
  // object-fit: cover box with the card's aspect ratio, and the capture is
  // the matching center-cover crop scaled to exactly STAFF_PHOTO_W x
  // STAFF_PHOTO_H — no pan/zoom, no countdown, no carousel.

  var STAFF_PHOTO_W = 172;
  var STAFF_PHOTO_H = 228;

  function buildPhotoTaker(entry, photoSlot, setStatus) {
    var wrap = el('div', 'staff-camera');

    var openControls = el('div', 'staff-camera-controls');
    var take = el('button', null, 'Take a new photo');
    var remove = el('button', 'staff-remove-photo', 'Remove photo');
    [take, remove].forEach(function (b) {
      b.type = 'button';
      openControls.appendChild(b);
    });
    wrap.appendChild(openControls);

    var stage = el('div', 'staff-camera-stage');
    var video = el('video');
    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;
    video.setAttribute('playsinline', ''); // iOS inline playback
    stage.appendChild(video);
    var shot = el('img', 'staff-shot');
    shot.alt = 'Your new photo';
    stage.appendChild(shot);
    wrap.appendChild(stage);

    var liveControls = el('div', 'staff-camera-controls');
    var snap = el('button', null, 'Snap');
    var flip = el('button', null, 'Switch camera');
    var use = el('button', null, 'Use this photo');
    var retake = el('button', null, 'Retake');
    var cancel = el('button', null, 'Cancel');
    [snap, flip, use, retake, cancel].forEach(function (b) {
      b.type = 'button';
      liveControls.appendChild(b);
    });
    wrap.appendChild(liveControls);

    var stream = null;
    var facing = 'user';
    var multipleCameras = false;
    var captured = ''; // the snapped data URL awaiting "Use this photo"

    // States: 'closed' (buttons only), 'live' (video), 'captured' (preview).
    function show(state) {
      openControls.style.display = state === 'closed' ? '' : 'none';
      remove.style.display = entry.photoOverride ? '' : 'none';
      stage.style.display = state === 'closed' ? 'none' : '';
      video.style.display = state === 'live' ? '' : 'none';
      shot.style.display = state === 'captured' ? '' : 'none';
      liveControls.style.display = state === 'closed' ? 'none' : '';
      snap.style.display = state === 'live' ? '' : 'none';
      flip.style.display = state === 'live' && multipleCameras ? '' : 'none';
      use.style.display = state === 'captured' ? '' : 'none';
      retake.style.display = state === 'captured' ? '' : 'none';
    }
    show('closed');

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(function (t) {
          t.stop();
        });
        stream = null;
      }
      video.srcObject = null;
    }

    function startCamera() {
      if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
        setStatus('This browser has no camera support.', true);
        return;
      }
      setStatus('Starting camera…');
      navigator.mediaDevices
        .getUserMedia({
          // A resolution hint well above the card size; capture downscales.
          video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 960 } },
          audio: false,
        })
        .then(function (s) {
          stream = s;
          video.srcObject = s;
          // Mirror the live preview only for the front camera, so it feels
          // like a mirror; capture() mirrors to match (WYSIWYG).
          video.style.transform = facing === 'user' ? 'scaleX(-1)' : '';
          show('live'); // before play() — iOS won't play a display:none video
          return video.play();
        })
        .then(function () {
          setStatus('');
          // Devices are only enumerable once permission is granted.
          if (!multipleCameras && navigator.mediaDevices.enumerateDevices) {
            navigator.mediaDevices.enumerateDevices().then(function (devices) {
              multipleCameras =
                devices.filter(function (d) {
                  return d.kind === 'videoinput';
                }).length > 1;
              if (stream) show('live'); // reveal the Switch button
            });
          }
        })
        .catch(function (err) {
          stopCamera();
          show('closed');
          setStatus(
            err && err.name === 'NotAllowedError'
              ? 'Camera permission denied — allow camera access in your browser and try again.'
              : 'Could not start the camera: ' + ((err && err.message) || err),
            true,
          );
        });
    }

    function capture() {
      var vw = video.videoWidth;
      var vh = video.videoHeight;
      if (!vw || !vh) {
        setStatus('The camera isn’t ready yet — try again.', true);
        return;
      }
      // The largest centered region of the video with the card's aspect
      // ratio — the same region the object-fit: cover preview shows.
      var srcW = vw;
      var srcH = vh;
      if (vw * STAFF_PHOTO_H > vh * STAFF_PHOTO_W) srcW = (vh * STAFF_PHOTO_W) / STAFF_PHOTO_H;
      else srcH = (vw * STAFF_PHOTO_H) / STAFF_PHOTO_W;

      var canvas = el('canvas');
      canvas.width = STAFF_PHOTO_W;
      canvas.height = STAFF_PHOTO_H;
      var g = canvas.getContext('2d');
      if (facing === 'user') {
        g.translate(STAFF_PHOTO_W, 0);
        g.scale(-1, 1);
      }
      g.drawImage(video, (vw - srcW) / 2, (vh - srcH) / 2, srcW, srcH, 0, 0, STAFF_PHOTO_W, STAFF_PHOTO_H);
      captured = canvas.toDataURL('image/jpeg', 0.9);
      shot.src = captured;
      show('captured'); // the stream stays live so Retake is instant
    }

    function swapPhoto() {
      photoSlot.innerHTML = '';
      photoSlot.appendChild(staffPhoto(entry));
    }

    take.addEventListener('click', startCamera);
    snap.addEventListener('click', capture);
    retake.addEventListener('click', function () {
      show('live');
    });
    cancel.addEventListener('click', function () {
      stopCamera();
      captured = '';
      show('closed');
      setStatus('');
    });
    flip.addEventListener('click', function () {
      stopCamera();
      facing = facing === 'user' ? 'environment' : 'user';
      startCamera();
    });

    use.addEventListener('click', function () {
      use.disabled = true;
      setStatus('Saving photo…');
      google.script.run
        .withSuccessHandler(function () {
          use.disabled = false;
          entry.photoUrl = captured;
          entry.photoOverride = true;
          swapPhoto();
          stopCamera();
          show('closed');
          setStatus('Photo saved.');
        })
        .withFailureHandler(function (err) {
          use.disabled = false;
          setStatus(err.message, true);
        })
        .saveStaffPhoto(captured, asParam());
    });

    remove.addEventListener('click', function () {
      if (!confirm('Remove your photo and go back to the directory one?')) return;
      remove.disabled = true;
      setStatus('Removing…');
      google.script.run
        .withSuccessHandler(function (result) {
          remove.disabled = false;
          entry.photoUrl = (result && result.photoUrl) || '';
          entry.photoOverride = false;
          swapPhoto();
          show('closed');
          setStatus('Photo removed — back to the directory photo.');
        })
        .withFailureHandler(function (err) {
          remove.disabled = false;
          setStatus(err.message, true);
        })
        .removeStaffPhoto(asParam());
    });

    return wrap;
  }

  // A labeled text input appended to the form; returns the input.
  function editField(form, label, value, required) {
    var wrap = el('label', null, label);
    var input = el('input');
    input.type = 'text';
    input.value = value || '';
    input.required = !!required;
    wrap.appendChild(input);
    form.appendChild(wrap);
    return input;
  }

  // The viewer's own row in the staff model (matched by ctx.effective, which
  // the server normalizes to lowercase, as are the scraped emails).
  function myStaffEntry() {
    var me = String((window.CTX || {}).effective || '').toLowerCase();
    var match = null;
    staffList().forEach(function (p) {
      if (!match && String(p.email || '').toLowerCase() === me) match = p;
    });
    return match;
  }
</script>
