<style>
  @import url('https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap');

  :root {
    --nav-h: 44px; /* fixed top navbar height */
  }

  html {
    box-sizing: border-box;
    font-family: Jost, system-ui, sans-serif;
  }
  *,
  *:before,
  *:after {
    box-sizing: inherit;
    padding: 0;
    margin: 0;
  }

  /* ---- Shared card ---- */
  .card {
    width: 172px;
  }
  .card img {
    width: 172px;
    height: auto;
    display: block;
    background: #dde;
    min-height: 120px;
  }
  /* Shown in place of the photo for students who have no photo. Sized per
     context to match the image it replaces. */
  .initials {
    width: 172px; /* grid default */
    aspect-ratio: 3 / 4;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    background: #ccd;
    color: #446;
    font-weight: 600;
    font-size: 2.4rem;
  }
  /* "Loading…" placeholder while a deferred photo is fetched. */
  .loading {
    width: 100%;
    aspect-ratio: 3 / 4;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    background: #dde;
    color: #667;
    font-style: italic;
    font-size: 1.3rem;
  }
  .swipe-card .loading {
    width: 60vw;
    max-width: 260px;
    margin: 0 auto; /* block boxes need centering the inline <img> gets free */
  }
  .swipe-card .initials {
    width: 60vw;
    max-width: 260px;
    font-size: min(18vw, 5rem);
    margin: 0 auto;
  }
  .shared-table td.photo .initials {
    width: 100px;
    font-size: 1.6rem;
  }
  .back .name {
    font-size: 1.5em;
    font-weight: 400;
  }
  .back p {
    text-align: center;
  }

  /* ---- Top navbar (Home / Learn / Shared, plus admin controls) ---- */
  #banner:empty {
    display: none; /* the server-rendered landing banner may be empty */
  }
  #banner {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    height: var(--nav-h);
    box-sizing: border-box;
    background: #443;
    color: #fff;
    font: 400 15px/1.4 sans-serif; /* fixed px so it doesn't shrink with the mobile root font */
    padding: 0 10px;
    display: flex;
    gap: 0.75em;
    align-items: center;
    white-space: nowrap;
    overflow-x: auto;
  }
  #banner .nav-links {
    display: flex;
    gap: 1em;
  }
  #banner .nav-link {
    color: #fff;
    text-decoration: none;
    font-weight: 500;
  }
  #banner .nav-note {
    color: #fda;
  }
  #banner a {
    color: #cdf;
  }
  #banner form {
    display: inline-flex;
    gap: 0.4em;
    align-items: center;
    margin-left: auto;
  }
  #banner input {
    font: inherit;
    padding: 1px 4px;
  }

  /* ---- Home view ---- */
  body.view-home {
    width: 90%;
    margin: calc(var(--nav-h) + 1em) auto;
    padding: 2em 2em 5em;
    background: #eeeefa;
    border-radius: 12px;
  }
  body.view-home h1 {
    margin: 1em 0 0.3em;
  }
  body.view-home .class-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1em;
    margin: 1em 0 0.3em;
    /* Round the row down to a whole number of card columns (172px card + 3px
       gap = 175px) so the buttons' right edge lines up with the last picture
       column. Falls back to full width where round() is unsupported. */
    width: calc(round(down, 100% + 3px, 175px) - 3px);
  }
  body.view-home .class-head h2 {
    margin: 0;
  }
  body.view-home .faces {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 3px;
  }
  body.view-home .back {
    display: none;
    flex-direction: column;
    justify-content: center;
    height: 100%;
  }
  .buttons {
    display: flex;
    gap: 0.5em;
    font-size: 1rem;
  }
  .buttons a {
    display: inline-block;
    border: 1px solid grey;
    text-decoration: none;
    font-family: sans-serif;
    border-radius: 6px;
    padding: 3px;
    background: #ddf;
    font-weight: 300;
    cursor: pointer;
  }

  /* ---- Staff view (reuses the home grid) ---- */
  .staff-filter {
    font: inherit;
    padding: 4px 8px;
    width: 100%;
    max-width: 20em;
    margin: 0.5em 0 0.2em;
  }
  .staff-count {
    margin: 0 0 0.5em;
    font-size: 0.95em;
    color: #445;
  }
  /* A teacher's course lines on the staff cards, quieter than the role. */
  .staff-course {
    font-size: 0.9em;
    color: #445;
  }

  /* Directory photos vary in size and aspect ratio; crop them to the 3:4
     shape the student portraits (and the initials box) have, so the grids
     and cards stay regular. */
  img.staff-photo {
    aspect-ratio: 3 / 4;
    object-fit: cover;
  }

  .staff-status {
    margin-top: 0.5em;
    color: #445;
  }
  .staff-status.error {
    color: #a00;
  }

  /* ---- Staff directory upload (admin, bottom of the Staff view) ---- */
  .staff-upload {
    margin-top: 3em;
    max-width: 26em;
  }
  .staff-upload .hint {
    margin: 0.3em 0 0.8em;
    font-size: 0.95em;
    color: #445;
  }
  .staff-upload form {
    display: flex;
    flex-direction: column;
    gap: 0.6em;
    align-items: flex-start;
  }
  .staff-upload textarea {
    font: inherit;
    padding: 4px 6px;
    width: 100%;
    height: 5em;
  }
  .staff-upload button {
    font: inherit;
    padding: 4px 12px;
    border: 1px solid grey;
    border-radius: 6px;
    background: #ddf;
    cursor: pointer;
  }

  /* The quiet student count in a class/list heading. */
  .class-head h2 .head-count {
    margin-left: 0.45em;
    font-size: 0.65em;
    font-weight: 400;
    color: #445;
  }

  /* ---- Custom-list upload form (bottom of the home view) ---- */
  .add-list {
    margin-top: 3em;
    max-width: 26em;
  }
  .add-list .hint {
    margin: 0.3em 0 0.8em;
    font-size: 0.95em;
    color: #445;
  }
  .add-list form {
    display: flex;
    flex-direction: column;
    gap: 0.6em;
    align-items: flex-start;
  }
  .add-list input[type='text'],
  .add-list textarea {
    font: inherit;
    padding: 4px 6px;
    width: 100%;
  }
  .add-list textarea {
    height: 7em;
  }
  .add-list button {
    font: inherit;
    padding: 4px 12px;
    border: 1px solid grey;
    border-radius: 6px;
    background: #ddf;
    cursor: pointer;
  }
  .list-status {
    margin-top: 0.5em;
    color: #a00;
  }
  .list-status:empty {
    display: none;
  }

  /* ---- Study view ---- */
  body.view-study {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-content: center;
    width: calc(min(40em, 80%));
    margin: var(--nav-h) auto 0; /* clear the fixed navbar */
    padding-bottom: 3em; /* clear the fixed progress bar */
    box-sizing: border-box;
    background: #eeeefa;
    border-radius: 12px;
    text-align: center;
    height: calc(100vh - var(--nav-h));
  }
  body.view-study .back {
    display: none;
    margin-top: 1em;
    font-size: clamp(17px, 4.5vmin, 24px); /* readable on mobile despite the small root font */
  }
  #study-header {
    margin: 0.4em 0 0.2em;
    font-size: clamp(18px, 4vmin, 26px);
    font-weight: 400;
  }
  #current {
    display: flex;
    flex: 1; /* fill the space between header and footer, centering the card */
    flex-direction: row;
    justify-content: center;
    align-items: center;
  }
  /* End-of-session message with its restart / missed-drill buttons. */
  .study-done {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5em;
  }
  .study-done .done-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5em;
  }
  .study-done p {
    margin: 0;
  }
  .study-done button {
    font-size: 1rem;
    font-family: sans-serif;
    font-weight: 300;
    border: 1px solid grey;
    border-radius: 6px;
    background: #ddf;
    padding: 0.5em 1.5em;
    cursor: pointer;
  }
  /* The retired-cards progress bar, fixed along the bottom of the screen
     during a learn/review session. */
  #study-progress {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    gap: 0.8em;
    padding: 0.5em 1em;
    box-sizing: border-box;
    background: white;
    border-top: 1px solid #ccc;
    font-size: 0.85rem;
    color: #555;
  }
  #study-progress .track {
    flex: 1;
    height: 8px;
    background: #ddd;
    border-radius: 4px;
    overflow: hidden;
  }
  #study-progress .fill {
    height: 100%;
    width: 0;
    background: #88a;
    border-radius: 4px;
    transition: width 0.2s;
  }
  #study-progress .count {
    white-space: nowrap;
    font-variant-numeric: tabular-nums; /* the count shouldn't jiggle */
  }
  #study-progress .reset {
    font: inherit;
    color: #339;
    background: none;
    border: none;
    padding: 0;
    text-decoration: underline;
    cursor: pointer;
    white-space: nowrap;
  }
  /* The card hugs the photo's native ~172px width but grows to fit the
     revealed info (up to the study box) so long lines don't wrap. Card and
     photo are both centered, so the photo doesn't shift when the card widens
     on reveal. */
  body.view-study .card {
    width: fit-content;
    min-width: 172px;
    max-width: calc(100% - 1em);
  }
  body.view-study .card img,
  body.view-study .card .initials,
  body.view-study .card .loading {
    width: 172px;
    max-width: 100%;
    height: auto;
    margin: 0 auto;
  }
  /* Navbar "?" help button + the overlay it opens. */
  .nav-help {
    display: inline-flex;
    align-items: center;
    border: none;
    background: none;
    color: #fff;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    padding: 0 0.3em;
  }
  .help-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: rgba(0, 0, 0, 0.5);
    align-items: center;
    justify-content: center;
    padding: 1em;
  }
  .help-overlay.show {
    display: flex;
  }
  .help-box {
    position: relative;
    background: #fff;
    border-radius: 10px;
    max-width: 26em;
    width: 100%;
    padding: 1.5em;
    text-align: left;
    max-height: 85vh;
    overflow-y: auto;
  }
  .help-box h2 {
    margin-bottom: 0.5em;
  }
  .help-box h3 {
    margin: 0.8em 0 0.2em;
    font-size: 1.05em;
  }
  .help-box p {
    margin: 0.4em 0;
  }
  .help-close {
    position: absolute;
    top: 0.2em;
    right: 0.4em;
    border: none;
    background: none;
    font-size: 1.8rem;
    line-height: 1;
    cursor: pointer;
  }

  /* In-page confirm dialog (confirmDialog in js-dom). */
  .confirm-overlay {
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1em;
  }
  .confirm-box {
    background: #fff;
    border-radius: 10px;
    max-width: 22em;
    width: 100%;
    padding: 1.5em;
    text-align: left;
  }
  .confirm-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 0.6em;
    margin-top: 1.2em;
  }
  .confirm-buttons button {
    font: inherit;
    padding: 4px 12px;
    border: 1px solid grey;
    border-radius: 6px;
    background: #ddf;
    cursor: pointer;
  }
  .confirm-buttons .confirm-go {
    border-color: #a33;
    background: #c0392b;
    color: #fff;
  }

  /* ---- Shared-with table view ---- */
  body.view-shared {
    width: 90%;
    margin: calc(var(--nav-h) + 1em) auto;
    padding: 2em 2em 5em;
    background: #eeeefa;
    border-radius: 12px;
  }
  .home-link {
    display: inline-block;
    margin-bottom: 1em;
  }
  /* ---- Shared overview table (the ?shared landing page) ---- */
  .shared-overview-table {
    border-collapse: collapse;
    margin-top: 0.5em;
  }
  .shared-overview-table td {
    padding: 10px 14px 10px 0;
    vertical-align: top;
    border-bottom: 1px solid #ccd;
  }
  .shared-overview-table tr:last-child td {
    border-bottom: none;
  }
  /* The photo is the tap target. The directory serves its photos at the
     natural card size (172x228; selfies match exactly), so desktop renders
     them as-is — the .initials base sizing already matches. On phones they
     scale up to about half the screen (see the media query below). */
  .shared-overview-table td.photo img,
  .shared-overview-table td.photo .initials {
    display: block;
    background: #dde;
  }
  .shared-overview-table td.info .name {
    font-size: 1.35em;
    margin: 0 0 4px;
  }
  .shared-overview-table td.info p {
    margin: 0 0 4px;
  }
  .shared-overview-table td.info .count {
    color: #445;
  }

  #shared-overview .shared-courses {
    margin: 0 0 0.5em;
    font-size: 0.95em;
    color: #445;
  }
  #shared h1 {
    margin: 0.25em 0 0.75em;
  }
  .shared-table {
    border-collapse: collapse;
    width: 100%;
  }
  .shared-table th,
  .shared-table td {
    border: 1px solid #ccd;
    padding: 6px 10px;
    text-align: left;
    vertical-align: top;
  }
  .shared-table th {
    background: #ddf;
    font-weight: 400;
  }
  .shared-table td.photo {
    width: 108px;
  }
  .shared-table td.photo img {
    width: 100px;
    height: auto;
    display: block;
    background: #dde;
    min-height: 70px;
  }
  .shared-table td.info .name {
    font-size: 1.15em;
  }
  .shared-table td.info p,
  .shared-table td.classes p {
    margin: 0 0 2px;
  }

  /* ---- One-at-a-time swipe viewer (mobile shared-with, and browse) ---- */
  body.view-shared-swipe,
  body.view-browse {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100vw;
    min-height: 100vh;
    padding: calc(var(--nav-h) + 0.5em) 1em 1em; /* top clears the fixed navbar */
    box-sizing: border-box;
    text-align: center;
  }
  #shared-swipe,
  #browse {
    width: 100%;
    max-width: 30em;
  }
  #shared-swipe .home-link {
    display: block;
    text-align: left;
  }
  #shared-swipe h1,
  #browse h1 {
    margin: 0.25em 0;
    font-size: 1.2em;
  }
  .swipe-counter {
    font-size: 0.9em;
    color: #445;
    margin-bottom: 0.5em;
  }
  .swipe-card img {
    width: 60vw;
    max-width: 260px;
    height: auto;
    background: #dde;
    min-height: 120px;
  }
  .swipe-info .name {
    font-size: 1.4em;
  }
  .swipe-info p {
    margin: 0.15em 0;
  }
  .swipe-classes {
    margin-top: 0.75em;
    font-size: 0.95em;
  }
  .swipe-classes p {
    margin: 0.2em 0;
  }
  .swipe-schedule {
    margin: 0.75em auto 0;
    border-collapse: collapse;
    font-size: 0.9em;
    text-align: left;
  }
  .swipe-schedule td {
    border: 1px solid #ccd;
    padding: 2px 8px;
    vertical-align: top;
  }
  .swipe-schedule td.period {
    text-align: center;
  }

  /* ---- Home menu ---- */
  body.view-menu {
    width: 90%;
    max-width: 40em;
    margin: calc(var(--nav-h) + 1em) auto;
    padding: 2em;
    background: #eeeefa;
    border-radius: 12px;
    text-align: center;
  }
  body.view-menu h1 {
    margin-bottom: 1em;
  }
  .menu-boxes {
    display: flex;
    gap: 1em;
    flex-wrap: wrap;
  }
  .menu-box {
    flex: 1 1 12em;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 6em;
    padding: 1.5em;
    border: 1px solid grey;
    border-radius: 8px;
    background: #ddf;
    text-decoration: none;
    color: inherit;
    font-size: 1.3em;
  }
  .menu-box:hover {
    background: #cce;
  }
  .menu-note {
    margin-top: 1.5em;
    font-size: 0.9em;
    color: #445;
  }
  .menu-qr {
    margin-top: 2em;
  }
  .menu-qr img {
    width: 220px;
    max-width: 60%;
    height: auto;
    /* The QR service can't render a transparent background; multiply makes
       the image's white pixels take the page color instead. */
    mix-blend-mode: multiply;
  }
  .menu-qr p {
    margin-top: 0.5em;
    font-size: 0.9em;
    color: #445;
  }

  /* ---- Landing view ---- */
  body.view-landing {
    width: 90%;
    max-width: 40em;
    margin: calc(var(--nav-h) + 1em) auto;
    padding: 2em;
    background: #eeeefa;
    border-radius: 12px;
    font-size: 1.1rem;
  }
  body.view-landing h1 {
    margin-bottom: 0.5em;
  }
  body.view-landing p {
    margin: 0.75em 0;
  }
  body.view-landing form {
    margin-top: 1.5em;
    display: flex;
    gap: 0.5em;
    align-items: center;
  }

  @media (width <= 600px) {
    body.view-home {
      display: flex;
      flex-direction: column;
      justify-content: start;
      width: 100vw;
      gap: 0.25vh;
      padding: 1em;
      margin: calc(var(--nav-h) + 1vh) auto 5vh; /* clear the fixed navbar */
      text-align: center;
      height: auto;
    }
    body.view-home .teacher-name {
      display: none; /* the navbar already says where you are */
    }
    body.view-home .class-head {
      display: block; /* stack heading + buttons on mobile */
      width: auto; /* full width; buttons stay half-and-half */
    }
    body.view-home .class-head h2 {
      margin: 0.7em 0 0.3em;
      font-size: clamp(20px, 5.5vmin, 28px);
      font-weight: 400;
    }
    body.view-home div.faces {
      display: none;
    }
    body.view-home .buttons {
      display: flex;
      gap: 0.5em;
      margin-bottom: 0.3em;
    }
    body.view-home .buttons a {
      flex: 1; /* the study-mode buttons share the width equally */
      text-align: center;
      padding: 0.7em 0;
      font-size: clamp(16px, 4.5vmin, 22px);
    }
    body.view-study {
      /* Nearly full width with a slight gutter, so the card (and its
         unwrapped info lines) can use the whole phone screen. */
      width: calc(100% - 1em);
      padding-bottom: 2.6em; /* clear the fixed progress bar */
    }
    /* The desktop view-shared box (90% width + 2em padding) squeezes a
       small phone to ~270px of content — the 50vw photo plus the info
       column overflowed. Go full width with a slim gutter instead. */
    body.view-shared {
      width: 100vw;
      margin: calc(var(--nav-h) + 1vh) auto 3vh;
      padding: 1em 0.75em 3em;
    }
    .shared-overview-table td.photo img,
    .shared-overview-table td.photo .initials {
      width: 50vw;
      aspect-ratio: 172 / 228;
      height: auto;
      object-fit: cover;
    }
    .shared-overview-table td.photo .initials {
      font-size: min(18vw, 6rem);
    }
  }
</style>
