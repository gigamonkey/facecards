<script>
  // Shared study driver for learn/review (merges the duplicated event handling
  // from public/js/learn.js and public/js/review.js). First input reveals the
  // card back; when the back is showing, left = wrong, right = correct.
  // Advances via arrow keys or touch swipes. Returns a teardown() that removes
  // the listeners so leaving study mode doesn't hijack the home view.
  //
  // opts.onRestart, if given, gets a restart button on the done screen
  // (labeled opts.restartLabel, default 'Redo') and a Start over button in
  // the progress bar — both discard the deck's saved progress and restart
  // the session.
  // opts.onStudyMissed, if given, adds 'Learn missed' / 'Review missed'
  // buttons to the done screen when any cards were missed; it gets the mode
  // ('learn' | 'review') and the missed cards.
  // opts.onAnswer is called after each graded answer, so the caller can
  // persist the deck's progress.
  function runStudy(state, currentEl, opts) {
    opts = opts || {};
    var current = null;

    // The retired-cards progress bar, fixed to the bottom of the screen.
    var progress = el('div');
    progress.id = 'study-progress';
    var track = el('div', 'track');
    var fill = el('div', 'fill');
    track.appendChild(fill);
    progress.appendChild(track);
    var count = el('span', 'count');
    progress.appendChild(count);
    if (opts.onRestart) {
      var reset = el('button', 'reset', 'Start over');
      reset.type = 'button';
      reset.addEventListener('click', function () {
        opts.onRestart();
      });
      progress.appendChild(reset);
    }
    // Taps on the bar are button presses, not study gestures — don't let them
    // bubble to the body's swipe handlers and flip the card.
    progress.addEventListener('touchstart', function (e) {
      e.stopPropagation();
    });
    progress.addEventListener('touchend', function (e) {
      e.stopPropagation();
    });
    document.body.appendChild(progress);

    function updateProgress() {
      var retired = state.total - state.remaining;
      fill.style.width = (state.total ? (100 * retired) / state.total : 0) + '%';
      count.textContent = retired + ' / ' + state.total;
    }

    function advance() {
      updateProgress();
      current = state.next();
      if (current === null) {
        var done = el('div', 'study-done');
        done.appendChild(el('p', null, state.doneMessage ? state.doneMessage() : 'Done!'));
        var buttons = el('div', 'done-buttons');
        if (opts.onRestart) {
          var redo = el('button', null, opts.restartLabel || 'Redo');
          redo.type = 'button';
          redo.addEventListener('click', opts.onRestart);
          buttons.appendChild(redo);
        }
        if (opts.onStudyMissed && state.missed && state.missed.length > 0) {
          [
            ['learn', 'Learn missed'],
            ['review', 'Review missed'],
          ].forEach(function (pair) {
            var b = el('button', null, pair[1]);
            b.type = 'button';
            b.addEventListener('click', function () {
              opts.onStudyMissed(pair[0], state.missed.slice());
            });
            buttons.appendChild(b);
          });
        }
        if (buttons.children.length > 0) done.appendChild(buttons);
        currentEl.replaceChildren(done);
      } else {
        loadCardImage(current); // fetch this card's photo only now that it's shown
        currentEl.replaceChildren(current);
      }
    }

    function handle(direction) {
      if (!current || helpOpen()) return;
      var back = current.querySelector('.back');
      if (getComputedStyle(back).display === 'none') {
        back.style.display = 'block';
      } else {
        if (direction === 'left') state.incorrect(current);
        else if (direction === 'right') state.correct(current);
        else return; // no swipe/neutral key: leave the back showing
        back.style.display = 'none';
        if (opts.onAnswer) opts.onAnswer();
        advance();
      }
    }

    var touchStart;
    function onTouchStart(e) {
      touchStart = e.touches[0].clientX;
    }
    function onTouchEnd(e) {
      var end = e.changedTouches[0].clientX;
      if (Math.abs(end - touchStart) > 50) handle(end > touchStart ? 'right' : 'left');
      else handle('none');
    }
    function onTouchMove(e) {
      if (helpOpen()) return; // the help box scrolls
      e.preventDefault(); // suppress scrolling while studying
    }
    function onKeyDown(e) {
      // The help overlay's own Escape handler runs first (registered earlier),
      // so by the time this fires helpOpen() is already false — don't let the
      // keypress that closed the overlay also reveal the card.
      if (e.key === 'Escape') return;
      var dir = e.code === 'ArrowLeft' ? 'left' : e.code === 'ArrowRight' ? 'right' : 'none';
      handle(dir);
    }

    document.body.addEventListener('touchstart', onTouchStart);
    document.body.addEventListener('touchend', onTouchEnd);
    document.addEventListener('touchmove', onTouchMove, { passive: false });
    window.addEventListener('keydown', onKeyDown);

    advance();

    return function teardown() {
      document.body.removeEventListener('touchstart', onTouchStart);
      document.body.removeEventListener('touchend', onTouchEnd);
      document.removeEventListener('touchmove', onTouchMove, { passive: false });
      window.removeEventListener('keydown', onKeyDown);
      progress.remove();
    };
  }
</script>
