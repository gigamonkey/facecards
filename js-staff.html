<script>
  // Staff directory view: the scraped BHS staff (window.STAFF) as a filterable
  // face grid with Learn / Review / Browse over whatever the filter matches,
  // plus the staff flavors of the flashcard and browse card. Staff photos are
  // public bhs.berkeleyschools.net URLs, so cards use plain <img>s — none of
  // the Drive direct-vs-proxy machinery (no Google cookies involved, so they
  // load everywhere, mobile Safari included).

  // The current filter query. Module-global so leaving for a study session and
  // coming back keeps the filter, and so js-app's studentsFor/titleFor can
  // scope study to the filtered set.
  var staffFilterQuery = '';

  function staffList() {
    return (window.STAFF && window.STAFF.staff) || [];
  }

  // The staff matching the current filter: case-insensitive substring match on
  // name and role ("math", "sped", "safety", …). This is what makes study
  // usable — the full directory is far too many cards for one Learn session.
  function staffMatches() {
    var q = staffFilterQuery.trim().toLowerCase();
    return staffList().filter(function (p) {
      return !q || staffSearchText(p).indexOf(q) !== -1;
    });
  }

  function staffSearchText(p) {
    return (p.firstName + ' ' + p.lastName + ' ' + p.role).toLowerCase();
  }

  function renderStaff(container, onStudy) {
    container.innerHTML = '';
    var home = el('div');
    home.id = 'home'; // reuse the home-view grid layout and CSS

    if (!staffList().length) {
      home.appendChild(el('h1', 'teacher-name', 'BHS staff'));
      home.appendChild(
        el('p', null, 'No staff data yet — run refreshStaffDirectory() from the Apps Script editor.'),
      );
      container.appendChild(home);
      return;
    }

    home.appendChild(classHead('BHS staff', onStudy, 'staff', ''));

    // Everyone gets the link; the edit page itself explains if the viewer has
    // no directory entry to edit.
    var editLink = el('p', 'staff-edit-link');
    var edit = el('a', null, 'Edit my entry');
    edit.href = appUrl('?staff-edit');
    if ((window.CTX || {}).baseUrl) edit.target = '_top';
    editLink.appendChild(edit);
    home.appendChild(editLink);

    var filter = el('input', 'staff-filter');
    filter.type = 'search';
    filter.placeholder = 'Filter by name or role';
    filter.setAttribute('aria-label', 'Filter staff by name or role');
    filter.value = staffFilterQuery;
    home.appendChild(filter);

    var count = el('p', 'staff-count');
    home.appendChild(count);

    // Build every card once; filtering just toggles visibility.
    var faces = el('div', 'faces');
    var cards = staffList().map(function (p) {
      var card = buildStaffCard(p);
      attachFlip(card);
      faces.appendChild(card);
      return card;
    });
    home.appendChild(faces);

    function applyFilter() {
      staffFilterQuery = filter.value;
      var q = staffFilterQuery.trim().toLowerCase();
      var matched = 0;
      staffList().forEach(function (p, i) {
        var show = !q || staffSearchText(p).indexOf(q) !== -1;
        cards[i].style.display = show ? '' : 'none';
        if (show) matched++;
      });
      count.textContent = matched + ' of ' + staffList().length;
    }
    filter.addEventListener('input', applyFilter);
    applyFilter();

    container.appendChild(home);
  }

  // A staff flashcard (grid and study modes): photo or initials front; first
  // name, full name, role, and username on the back.
  function buildStaffCard(p) {
    var card = el('div', 'card');
    card.appendChild(staffPhoto(p));

    var back = el('div', 'back');
    back.appendChild(el('p', 'name', p.firstName));
    back.appendChild(el('p', null, (p.firstName || '') + ' ' + (p.lastName || '')));
    if (p.role) back.appendChild(el('p', null, p.role));
    if (p.email) back.appendChild(el('p', null, staffUsername(p.email)));
    card.appendChild(back);

    return card;
  }

  // The photo (or initials box) for a staff card. Empty alt so a broken image
  // can't leak the name mid-study; the name is on the card anyway.
  function staffPhoto(p) {
    if (!p.photoUrl) return el('div', 'initials', initials(p));
    var img = el('img', 'staff-photo');
    img.alt = '';
    img.loading = 'lazy';
    img.src = p.photoUrl;
    return img;
  }

  function staffUsername(email) {
    return String(email).replace(/@berkeley\.net$/, '');
  }

  // Browse for staff: the same one-at-a-time carousel as student browse, with
  // everything visible. Model order (last name) — no re-sort, unlike students,
  // who browse by displayed first name.
  function renderStaffBrowse(container, title, staff) {
    container.innerHTML = '';
    var wrap = el('div');
    wrap.id = 'browse';
    wrap.appendChild(el('h1', null, title));

    var teardown = runCarousel(wrap, staff.map(buildStaffBrowseCard));
    preloadStaffPhotos(staff);
    container.appendChild(wrap);
    return teardown;
  }

  function buildStaffBrowseCard(p) {
    var card = el('div', 'swipe-card');
    card.appendChild(staffPhoto(p));

    var info = el('div', 'swipe-info');
    info.appendChild(el('p', 'name', (p.firstName || '') + ' ' + (p.lastName || '')));
    if (p.role) info.appendChild(el('p', null, p.role));
    if (p.email) info.appendChild(el('p', null, staffUsername(p.email)));
    card.appendChild(info);

    return card;
  }

  function preloadStaffPhotos(staff) {
    warmUrls(
      staff.map(function (p) {
        return p.photoUrl;
      }),
      DIRECT_POOL,
    );
  }

  // The self-edit form (?staff-edit): correct your own directory entry. Saves
  // to the `staff overrides` tab via google.script.run, so a directory
  // re-scrape doesn't undo the fix. Photo editing is deliberately absent for
  // now. The viewer's entry is found by ctx.effective, so an admin editing
  // via ?as= sees and edits the impersonated person's entry.
  function renderStaffEdit(container) {
    container.innerHTML = '';
    var ctx = window.CTX || {};
    var wrap = el('div');
    wrap.id = 'staff-edit';

    var backLink = el('a', 'home-link', '← All staff');
    backLink.href = appUrl('?staff');
    if (ctx.baseUrl) backLink.target = '_top';
    wrap.appendChild(backLink);

    wrap.appendChild(el('h1', null, 'My staff entry'));

    var entry = myStaffEntry();
    if (!entry) {
      wrap.appendChild(
        el(
          'p',
          null,
          'No staff directory entry found for ' +
            staffUsername(ctx.effective || '') +
            '. Entries come from the BHS staff directory — contact Mr. Seibel if yours is missing.',
        ),
      );
      container.appendChild(wrap);
      return;
    }

    wrap.appendChild(staffPhoto(entry));
    wrap.appendChild(el('p', 'hint', 'Photo changes are coming later.'));

    var form = el('form');
    var firstName = editField(form, 'First name', entry.firstName, true);
    var lastName = editField(form, 'Last name', entry.lastName, true);
    var role = editField(form, 'Role', entry.role, false);

    var save = el('button', null, 'Save');
    save.type = 'submit';
    form.appendChild(save);
    wrap.appendChild(form);

    var status = el('p', 'staff-status');
    wrap.appendChild(status);

    // Always in the DOM; shown only while an override exists.
    var reset = el('button', 'staff-reset', 'Reset to directory values');
    reset.type = 'button';
    wrap.appendChild(reset);

    function setStatus(msg, isError) {
      status.textContent = msg;
      status.classList.toggle('error', !!isError);
    }

    function showOverridden(on) {
      entry.overridden = on;
      reset.style.display = on ? '' : 'none';
    }
    showOverridden(entry.overridden);

    // Both handlers update the page in place — no navigation. Navigating from
    // an async success handler (window.top.location.href) gets silently
    // blocked by the sandbox ('allow-top-navigation-by-user-activation'):
    // by the time the server call returns, the click's user activation has
    // expired, so the form just hung on "Saving…". The ← All staff link is a
    // real click, so leaving still works.
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      save.disabled = true;
      setStatus('Saving…');
      var fields = { firstName: firstName.value, lastName: lastName.value, role: role.value };
      google.script.run
        .withSuccessHandler(function (result) {
          save.disabled = false;
          // Keep the client model in step so revisiting the form (or the
          // grid, within this page's lifetime) shows the saved values.
          entry.firstName = firstName.value = String(fields.firstName).trim();
          entry.lastName = lastName.value = String(fields.lastName).trim();
          entry.role = role.value = String(fields.role).trim();
          var overridden = !!(result && result.overridden);
          setStatus(overridden ? 'Saved.' : 'Saved — same as the directory, so nothing to override.');
          showOverridden(overridden);
        })
        .withFailureHandler(function (err) {
          save.disabled = false;
          setStatus(err.message, true);
        })
        .saveStaffOverride(fields, asParam());
    });

    reset.addEventListener('click', function () {
      if (!confirm('Discard your edits and go back to the directory values?')) return;
      reset.disabled = true;
      setStatus('Resetting…');
      google.script.run
        .withSuccessHandler(function (base) {
          reset.disabled = false;
          // The server sends back the scraped values so the form can show
          // them without a reload.
          if (base) {
            entry.firstName = firstName.value = base.firstName;
            entry.lastName = lastName.value = base.lastName;
            entry.role = role.value = base.role;
          }
          setStatus('Reset to the directory values.');
          showOverridden(false);
        })
        .withFailureHandler(function (err) {
          reset.disabled = false;
          setStatus(err.message, true);
        })
        .deleteStaffOverride(asParam());
    });

    wrap.appendChild(
      el(
        'p',
        'hint',
        'Your changes are stored separately from the directory, so they survive ' +
          'directory refreshes. Editing the entry for ' +
          staffUsername(ctx.effective || '') +
          '.',
      ),
    );

    container.appendChild(wrap);
  }

  // A labeled text input appended to the form; returns the input.
  function editField(form, label, value, required) {
    var wrap = el('label', null, label);
    var input = el('input');
    input.type = 'text';
    input.value = value || '';
    input.required = !!required;
    wrap.appendChild(input);
    form.appendChild(wrap);
    return input;
  }

  // The viewer's own row in the staff model (matched by ctx.effective, which
  // the server normalizes to lowercase, as are the scraped emails).
  function myStaffEntry() {
    var me = String((window.CTX || {}).effective || '').toLowerCase();
    var match = null;
    staffList().forEach(function (p) {
      if (!match && String(p.email || '').toLowerCase() === me) match = p;
    });
    return match;
  }
</script>
