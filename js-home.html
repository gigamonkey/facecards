<script>
  // Render the home view: the viewer's classes as photo-card grids, with
  // learn/review/browse links per class and for all of their students. Port of
  // views/index.njk (minus the outer per-teacher loop — it's one teacher).

  function renderHome(container, model, onStudy) {
    container.innerHTML = '';
    var home = el('div');
    home.id = 'home';

    // Teacher name (hidden on mobile via CSS).
    home.appendChild(el('h1', 'teacher-name', model.teacherLast || 'My students'));

    var total = 0;
    Object.keys(model.classes).forEach(function (slug) {
      total += model.classes[slug].students.length;
    });
    home.appendChild(classHead('All students', total, onStudy, 'all', ''));

    Object.keys(model.classes).forEach(function (slug) {
      var c = model.classes[slug];

      home.appendChild(classHead(c.name, c.students.length, onStudy, 'class', slug));

      var faces = el('div', 'faces');
      c.students
        .slice()
        .sort(function (a, b) {
          return String(a.firstName).localeCompare(String(b.firstName));
        })
        .forEach(function (s) {
          var card = buildCard(s, { showNumber: true, nameWithFirst: false });
          attachFlip(card);
          faces.appendChild(card);
        });
      home.appendChild(faces);
    });

    renderLists(home, model, onStudy);

    container.appendChild(home);
  }

  // The custom-lists section of the home view: each saved list as a face grid
  // with the same Learn/Review/Browse buttons as a class (plus Delete), then
  // the form for uploading or pasting a new list. Owner-only — the server
  // sends model.lists (possibly empty) only to the app owner, so its absence
  // hides the whole section, form included.
  function renderLists(home, model, onStudy) {
    var lists = model.lists;
    if (!lists) return;

    Object.keys(lists)
      .sort(function (a, b) {
        return String(lists[a].name).localeCompare(String(lists[b].name));
      })
      .forEach(function (slug) {
        var list = lists[slug];

        var head = classHead(list.name, list.students.length, onStudy, 'list', slug);
        var status = el('p', 'list-status'); // per-list: delete progress/errors
        head.querySelector('.buttons').appendChild(
          studyLink('Delete', function () {
            confirmDialog('Delete the list “' + list.name + '”?', 'Delete', function () {
              status.textContent = 'Deleting…';
              google.script.run
                .withSuccessHandler(function () {
                  reloadHome(status);
                })
                .withFailureHandler(function (err) {
                  status.textContent = err.message;
                })
                .deleteList(list.name, asParam());
            });
          }),
        );
        home.appendChild(head);
        home.appendChild(status);

        // A big list's grid would dwarf the classes above it — past 35
        // students show no grid (the count is in the heading and the study
        // modes still work on it).
        if (list.students.length > 35) return;

        var faces = el('div', 'faces');
        list.students
          .slice()
          .sort(function (a, b) {
            return String(a.firstName).localeCompare(String(b.firstName));
          })
          .forEach(function (s) {
            // hideClass: a list spans classes, so there's no one course/period.
            var card = buildCard(s, { showNumber: true, hideClass: true });
            attachFlip(card);
            faces.appendChild(card);
          });
        home.appendChild(faces);
      });

    home.appendChild(buildListForm());
  }

  // The "Add a list" form: a name plus student numbers from an uploaded text
  // file or the textarea (the file wins if both are given). Saving replaces a
  // same-named list; skipped lines come back in the result for a warning.
  function buildListForm() {
    var wrap = el('div', 'add-list');
    wrap.appendChild(el('h2', null, 'Add a list'));
    wrap.appendChild(
      el(
        'p',
        'hint',
        'Make a custom list to study: upload a text file of student numbers — ' +
          'one per line — or paste them below. A .tsv works too: the first ' +
          'column is the student number and any other columns show on the back ' +
          'of the card. A list can include any students, not just your own. ' +
          'Saving under an existing name replaces that list.',
      ),
    );

    var form = el('form');
    var name = el('input');
    name.type = 'text';
    name.placeholder = 'List name';
    name.setAttribute('aria-label', 'List name');
    name.required = true;
    form.appendChild(name);

    var file = el('input');
    file.type = 'file';
    file.accept = '.txt,.tsv,text/plain,text/tab-separated-values';
    form.appendChild(file);

    var textarea = el('textarea');
    textarea.placeholder = 'Or paste student numbers here, one per line';
    form.appendChild(textarea);

    var save = el('button', null, 'Save list');
    save.type = 'submit';
    form.appendChild(save);

    // A div, not a p: the skipped-lines report below nests a list and a
    // button inside it.
    var status = el('div', 'list-status');

    function send(listName, text) {
      if (!text.trim()) {
        status.textContent = 'Choose a file or paste some student numbers first.';
        return;
      }
      save.disabled = true;
      status.textContent = 'Saving…';
      google.script.run
        .withSuccessHandler(function (result) {
          var skipped = (result.unknown || []).concat(result.invalid || []);
          if (!skipped.length) {
            reloadHome(status);
            return;
          }
          // The save landed but some lines didn't: report them inline and
          // hold the reload (which would wipe the report) until OK is
          // clicked -- a real gesture, so the sandbox always allows that
          // navigation.
          save.disabled = false;
          status.textContent =
            'Saved ' +
            result.saved +
            ' students to “' +
            listName +
            '”. Skipped ' +
            skipped.length +
            ' lines that aren’t roster student numbers:';
          var lines = el('ul');
          skipped.forEach(function (line) {
            lines.appendChild(el('li', null, line));
          });
          status.appendChild(lines);
          var ok = el('button', null, 'OK');
          ok.type = 'button';
          ok.addEventListener('click', function () {
            reloadHome(status);
          });
          status.appendChild(ok);
        })
        .withFailureHandler(function (err) {
          save.disabled = false;
          status.textContent = err.message;
        })
        .saveList(listName, text, asParam());
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var listName = name.value.trim();
      if (!listName) return; // `required` should have caught it
      if (file.files && file.files.length) {
        var reader = new FileReader();
        reader.onload = function () {
          send(listName, String(reader.result));
        };
        reader.onerror = function () {
          status.textContent = 'Could not read that file.';
        };
        reader.readAsText(file.files[0]);
      } else {
        send(listName, textarea.value);
      }
    });

    wrap.appendChild(form);
    wrap.appendChild(status);
    return wrap;
  }

  // The ?as= to pass to the write endpoints (lists, staff overrides) so an
  // admin's edits land under the impersonated user (the server re-checks
  // admin-ness). The owner-only list endpoints instead reject any
  // impersonated call — but their UI is never shown while impersonating.
  function asParam() {
    var ctx = window.CTX || {};
    return ctx.impersonating ? ctx.effective : '';
  }

  // Full reload of the Mine page after a list edit — the invalidated model
  // rebuilds server-side with the change. status is the caller's inline
  // status element, for when the reload can't happen: the sandbox refuses
  // top navigation once the click's user activation has expired (a slow
  // round-trip). The edit did land — the user just needs a fresh page, and
  // their next tap is a real gesture.
  function reloadHome(status) {
    var ctx = window.CTX || {};
    try {
      if (ctx.baseUrl) window.top.location.href = appUrl('?learn');
      else location.reload();
    } catch (err) {
      status.textContent = 'Saved. Tap Mine to see the change.';
    }
  }

  // A class heading (name plus a quiet student count, unless count is null)
  // with its study-mode buttons — on one row (desktop) or stacked (mobile),
  // controlled by CSS.
  function classHead(name, count, onStudy, scope, id) {
    var head = el('div', 'class-head');
    var h2 = el('h2', null, name);
    if (count != null) h2.appendChild(el('span', 'head-count', '(' + count + ')'));
    head.appendChild(h2);
    head.appendChild(buttonsRow(onStudy, scope, id));
    return head;
  }

  // The Learn/Review/Browse buttons for a study scope.
  function buttonsRow(onStudy, scope, id) {
    var div = el('div', 'buttons');
    ['learn', 'review', 'browse'].forEach(function (mode) {
      div.appendChild(
        studyLink(mode.charAt(0).toUpperCase() + mode.slice(1), function () {
          onStudy(mode, scope, id);
        }),
      );
    });
    return div;
  }

  // Render the browse view: the scope's students one at a time like Learn and
  // Review, but with the info always showing — swipe (or arrow keys) to move
  // between students, like the shared-students carousel whose machinery and CSS
  // it reuses. Returns the carousel's teardown (it hooks document-level
  // listeners) for the controller to run on leaving the view.
  function renderBrowse(container, title, students) {
    container.innerHTML = '';
    var wrap = el('div');
    wrap.id = 'browse';
    wrap.appendChild(el('h1', null, title));

    // Sorted by the name we display, which prefers the nickname.
    function effectiveName(s) {
      return String(s.nickname || s.firstName || '');
    }
    var cards = students
      .slice()
      .sort(function (a, b) {
        return (
          effectiveName(a).localeCompare(effectiveName(b)) ||
          String(a.lastName || '').localeCompare(String(b.lastName || ''))
        );
      })
      .map(buildBrowseCard);

    var teardown = runCarousel(wrap, cards);
    preloadPhotos(
      students.map(function (s) {
        return s.fileId;
      }),
    );
    container.appendChild(wrap);
    return teardown;
  }

  // A carousel card for browse: photo above the student's info (which, unlike a
  // flashcard, is always visible).
  function buildBrowseCard(s) {
    var card = el('div', 'swipe-card');

    if (!s.fileId) {
      card.appendChild(el('div', 'initials', initials(s)));
    } else {
      card.appendChild(loadingBox(s.fileId)); // loaded direct-or-proxied when shown
    }

    var info = el('div', 'swipe-info');
    info.appendChild(
      el('p', 'name', s.nickname ? s.nickname + ' (' + s.firstName + ')' : s.firstName),
    );
    info.appendChild(
      el(
        'p',
        null,
        (s.firstName || '') + ' ' + (s.lastName || '') + ' — ' + (s.grade || '') + ' / ' + (s.gender || ''),
      ),
    );
    card.appendChild(info);

    // The student's full schedule: period, class, teacher. (Guarded — a model
    // cached before schedules were added won't have it.)
    if (s.schedule && s.schedule.length) {
      var table = el('table', 'swipe-schedule');
      var tbody = el('tbody');
      s.schedule.forEach(function (row) {
        var tr = el('tr');
        tr.appendChild(el('td', 'period', String(row.period)));
        tr.appendChild(el('td', null, row.course));
        tr.appendChild(el('td', null, row.teacher));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      card.appendChild(table);
    }

    return card;
  }

  function studyLink(text, handler) {
    var a = el('a', null, text);
    a.href = '#';
    a.addEventListener('click', function (e) {
      e.preventDefault();
      handler();
    });
    return a;
  }

  // Flip a card between its front (photo or initials box) and info on click
  // (port of public/js/index.js).
  function attachFlip(card) {
    card.dataset.showing = 'front';
    var front = card.querySelector('img') || card.querySelector('.initials');
    var back = card.querySelector('.back');
    card.onclick = function () {
      if (card.dataset.showing === 'front') {
        front.style.display = 'none';
        back.style.display = 'flex';
        card.dataset.showing = 'back';
      } else {
        front.style.display = ''; // revert to the CSS default (block img / flex initials)
        back.style.display = 'none';
        card.dataset.showing = 'front';
      }
    };
  }
</script>
