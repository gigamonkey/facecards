<style>
  @import url('https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap');

  :root {
    --nav-h: 44px; /* fixed top navbar height */
  }

  html {
    box-sizing: border-box;
    font-family: Jost, system-ui, sans-serif;
  }
  *,
  *:before,
  *:after {
    box-sizing: inherit;
    padding: 0;
    margin: 0;
  }

  /* ---- Shared card ---- */
  .card {
    width: 172px;
  }
  .card img {
    width: 172px;
    height: auto;
    display: block;
    background: #dde;
    min-height: 120px;
  }
  /* Shown in place of the photo for students who have no photo. Sized per
     context to match the image it replaces. */
  .initials {
    width: 172px; /* grid default */
    aspect-ratio: 3 / 4;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    background: #ccd;
    color: #446;
    font-weight: 600;
    font-size: 2.4rem;
  }
  body.view-study .card .initials {
    width: 100%;
    font-size: min(22vw, 6rem);
  }
  .swipe-card .initials {
    width: 60vw;
    max-width: 260px;
    font-size: min(18vw, 5rem);
  }
  .shared-table td.photo .initials {
    width: 100px;
    font-size: 1.6rem;
  }
  .back .name {
    font-size: 1.5em;
    font-weight: 400;
  }
  .back p {
    text-align: center;
  }

  /* ---- Top navbar (Home / Learn / Shared, plus admin controls) ---- */
  #banner:empty {
    display: none; /* the server-rendered landing banner may be empty */
  }
  #banner {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    height: var(--nav-h);
    box-sizing: border-box;
    background: #443;
    color: #fff;
    font: 400 15px/1.4 sans-serif; /* fixed px so it doesn't shrink with the mobile root font */
    padding: 0 10px;
    display: flex;
    gap: 0.75em;
    align-items: center;
    white-space: nowrap;
    overflow-x: auto;
  }
  #banner .nav-links {
    display: flex;
    gap: 1em;
  }
  #banner .nav-link {
    color: #fff;
    text-decoration: none;
    font-weight: 500;
  }
  #banner .nav-note {
    color: #fda;
  }
  #banner a {
    color: #cdf;
  }
  #banner form {
    display: inline-flex;
    gap: 0.4em;
    align-items: center;
    margin-left: auto;
  }
  #banner input {
    font: inherit;
    padding: 1px 4px;
  }

  /* ---- Home view ---- */
  body.view-home {
    width: 90%;
    margin: calc(var(--nav-h) + 1em) auto;
    padding: 2em 2em 5em;
    background: #eeeefa;
    border-radius: 12px;
  }
  body.view-home h1 {
    margin: 1em 0 0.3em;
  }
  body.view-home h2 {
    margin: 1em 0 0.3em;
  }
  body.view-home .faces {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 3px;
  }
  body.view-home .back {
    display: none;
    flex-direction: column;
    justify-content: center;
    height: 100%;
  }
  .buttons {
    font-size: 1rem;
  }
  .buttons a {
    display: inline-block;
    border: 1px solid grey;
    text-decoration: none;
    font-family: sans-serif;
    border-radius: 6px;
    padding: 3px;
    background: #ddf;
    font-weight: 300;
    cursor: pointer;
  }

  /* ---- Study view ---- */
  body.view-study {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-content: center;
    width: calc(min(40em, 80%));
    margin: var(--nav-h) auto 0; /* clear the fixed navbar */
    padding-bottom: 1em;
    box-sizing: border-box;
    background: #eeeefa;
    border-radius: 12px;
    text-align: center;
    height: calc(100vh - var(--nav-h));
  }
  body.view-study .back {
    display: none;
    margin-top: 1em;
    font-size: clamp(17px, 4.5vmin, 24px); /* readable on mobile despite the small root font */
  }
  #study-header {
    margin: 0.4em 0 0.2em;
    font-size: clamp(18px, 4vmin, 26px);
    font-weight: 400;
  }
  #current {
    display: flex;
    flex: 1; /* fill the space between header and footer, centering the card */
    flex-direction: row;
    justify-content: center;
    align-items: center;
  }
  /* Bigger photos in study mode than in the home grid. The card is a fixed width
     (the photo's width) and both the photo and the revealed info fill it, so the
     photo doesn't shift when the info appears. */
  body.view-study .card {
    width: 320px;
    max-width: 90vw;
  }
  body.view-study .card img {
    width: 100%;
    height: auto;
  }
  /* Navbar "?" help button + the overlay it opens. */
  .nav-help {
    display: inline-flex;
    align-items: center;
    border: none;
    background: none;
    color: #fff;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    padding: 0 0.3em;
  }
  .help-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: rgba(0, 0, 0, 0.5);
    align-items: center;
    justify-content: center;
    padding: 1em;
  }
  .help-overlay.show {
    display: flex;
  }
  .help-box {
    position: relative;
    background: #fff;
    border-radius: 10px;
    max-width: 26em;
    width: 100%;
    padding: 1.5em;
    text-align: left;
  }
  .help-box h2 {
    margin-bottom: 0.5em;
  }
  .help-close {
    position: absolute;
    top: 0.2em;
    right: 0.4em;
    border: none;
    background: none;
    font-size: 1.8rem;
    line-height: 1;
    cursor: pointer;
  }

  /* ---- Shared-with table view ---- */
  body.view-shared {
    width: 90%;
    margin: calc(var(--nav-h) + 1em) auto;
    padding: 2em 2em 5em;
    background: #eeeefa;
    border-radius: 12px;
  }
  .home-link {
    display: inline-block;
    margin-bottom: 1em;
  }
  #shared-overview .shared-courses {
    margin: 0 0 0.5em;
    font-size: 0.95em;
    color: #445;
  }
  #shared h1 {
    margin: 0.25em 0 0.75em;
  }
  .shared-table {
    border-collapse: collapse;
    width: 100%;
  }
  .shared-table th,
  .shared-table td {
    border: 1px solid #ccd;
    padding: 6px 10px;
    text-align: left;
    vertical-align: top;
  }
  .shared-table th {
    background: #ddf;
    font-weight: 400;
  }
  .shared-table td.photo {
    width: 108px;
  }
  .shared-table td.photo img {
    width: 100px;
    height: auto;
    display: block;
    background: #dde;
    min-height: 70px;
  }
  .shared-table td.info .name {
    font-size: 1.15em;
  }
  .shared-table td.info p,
  .shared-table td.classes p {
    margin: 0 0 2px;
  }

  /* ---- Mobile shared: teacher list ---- */
  #shared-list {
    text-align: center;
  }
  #shared-list h1 {
    font-size: clamp(24px, 8vmin, 36px);
    margin: 0.3em 0 0.6em;
  }
  #shared-list .shared-list-row {
    margin: 0.8em 0;
    font-size: clamp(22px, 7vmin, 30px);
  }
  #shared-list .count {
    color: #445;
    font-size: 0.55em;
  }

  /* ---- Mobile shared: one-at-a-time swipe viewer ---- */
  body.view-shared-swipe {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100vw;
    min-height: 100vh;
    padding: calc(var(--nav-h) + 0.5em) 1em 1em; /* top clears the fixed navbar */
    box-sizing: border-box;
    text-align: center;
  }
  #shared-swipe {
    width: 100%;
    max-width: 30em;
  }
  #shared-swipe .home-link {
    display: block;
    text-align: left;
  }
  #shared-swipe h1 {
    margin: 0.25em 0;
    font-size: 1.2em;
  }
  .swipe-counter {
    font-size: 0.9em;
    color: #445;
    margin-bottom: 0.5em;
  }
  .swipe-card img {
    width: 60vw;
    max-width: 260px;
    height: auto;
    background: #dde;
    min-height: 120px;
  }
  .swipe-info .name {
    font-size: 1.4em;
  }
  .swipe-info p {
    margin: 0.15em 0;
  }
  .swipe-classes {
    margin-top: 0.75em;
    font-size: 0.95em;
  }
  .swipe-classes p {
    margin: 0.2em 0;
  }

  /* ---- Home menu ---- */
  body.view-menu {
    width: 90%;
    max-width: 40em;
    margin: calc(var(--nav-h) + 1em) auto;
    padding: 2em;
    background: #eeeefa;
    border-radius: 12px;
    text-align: center;
  }
  body.view-menu h1 {
    margin-bottom: 1em;
  }
  .menu-boxes {
    display: flex;
    gap: 1em;
    flex-wrap: wrap;
  }
  .menu-box {
    flex: 1 1 12em;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 6em;
    padding: 1.5em;
    border: 1px solid grey;
    border-radius: 8px;
    background: #ddf;
    text-decoration: none;
    color: inherit;
    font-size: 1.3em;
  }
  .menu-box:hover {
    background: #cce;
  }
  .menu-qr {
    margin-top: 2em;
  }
  .menu-qr img {
    width: 220px;
    max-width: 60%;
    height: auto;
  }
  .menu-qr p {
    margin-top: 0.5em;
    font-size: 0.9em;
    color: #445;
  }

  /* ---- Landing view ---- */
  body.view-landing {
    width: 90%;
    max-width: 40em;
    margin: calc(var(--nav-h) + 1em) auto;
    padding: 2em;
    background: #eeeefa;
    border-radius: 12px;
    font-size: 1.1rem;
  }
  body.view-landing h1 {
    margin-bottom: 0.5em;
  }
  body.view-landing p {
    margin: 0.75em 0;
  }
  body.view-landing form {
    margin-top: 1.5em;
    display: flex;
    gap: 0.5em;
    align-items: center;
  }

  @media (width <= 600px) {
    body.view-home {
      display: flex;
      flex-direction: column;
      justify-content: start;
      width: 100vw;
      gap: 0.25vh;
      padding: 1em;
      margin: calc(var(--nav-h) + 1vh) auto 5vh; /* clear the fixed navbar */
      text-align: center;
      height: auto;
    }
    body.view-home .teacher-name {
      display: none; /* the navbar already says where you are */
    }
    body.view-home h2 {
      margin: 0.7em 0 0.3em;
      font-size: clamp(20px, 5.5vmin, 28px);
      font-weight: 400;
    }
    body.view-home div.faces {
      display: none;
    }
    body.view-home .buttons {
      display: flex;
      gap: 0.5em;
      margin-bottom: 0.3em;
    }
    body.view-home .buttons a {
      flex: 1; /* Learn / Review each take half the width */
      text-align: center;
      padding: 0.7em 0;
      font-size: clamp(16px, 4.5vmin, 22px);
    }
    /* Photos take most of the width. */
    body.view-study {
      width: 100vw;
      padding-bottom: 0;
    }
    body.view-study .card {
      width: 85vw;
      max-width: 85vw;
    }
  }
</style>
