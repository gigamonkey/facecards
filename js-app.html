<script>
  // Client controller: single-page app that toggles between the home grid and a
  // study session without reloading. Honors a server-provided deep link
  // (window.ROUTE) on first load and renders the admin/impersonation banner
  // (window.CTX).
  (function () {
    var MODEL = window.MODEL || { classes: {}, teacherLast: '' };
    var ROUTE = window.ROUTE || { mode: 'home', scope: '', id: '' };
    var CTX = window.CTX || {};

    var app = document.getElementById('app');
    var banner = document.getElementById('banner');
    var teardownStudy = null;

    // The owner's navbar upload buttons and their modals (openUpload /
    // buildUploadOverlay, below): one entry per uploadable tab. Defined
    // before renderBanner() runs, since it builds a button per entry.
    var UPLOADS = {
      roster: {
        label: 'Roster',
        title: 'Replace the roster',
        hint:
          'Upload a fresh roster export (.csv or .tsv). It replaces everything in ' +
          'the rosters tab, so it must be the complete roster — every teacher’s ' +
          'sections — with the usual header row (studentNumber, firstName, ' +
          'lastName, period, course, teacherEmail, teacherName, …).',
        button: 'Replace roster',
        endpoint: 'uploadRoster',
        describe: function (result) {
          return (
            'Loaded ' + result.rows + ' rows: ' + result.students + ' students across ' +
            result.teachers + ' teachers — '
          );
        },
      },
      counselors: {
        label: 'Counselors',
        title: 'Replace the counselor mapping',
        hint:
          'Upload a fresh counselor export (.csv or .tsv). It replaces everything ' +
          'in the counselors tab, so it must be the complete mapping — every ' +
          'student’s counselor — with a header row including studentNumber and ' +
          'counselorEmail (plus counselorName, “Last, First”, if you have it).',
        button: 'Replace counselors',
        endpoint: 'uploadCounselors',
        describe: function (result) {
          return (
            'Loaded ' + result.rows + ' rows across ' + result.counselors + ' counselors' +
            (result.unmatched
              ? ' (' + result.unmatched + ' rows matched no roster student)'
              : '') +
            ' — '
          );
        },
      },
    };

    var helpOverlay = buildHelpOverlay();
    document.body.appendChild(helpOverlay);

    renderBanner();

    function setView(name) {
      document.body.className = 'view-' + name;
    }

    function isMobile() {
      return !!(window.matchMedia && window.matchMedia('(max-width: 600px)').matches);
    }

    function clearStudy() {
      if (teardownStudy) {
        teardownStudy();
        teardownStudy = null;
      }
    }

    function showHome() {
      clearStudy();
      setView('home');
      renderHome(app, MODEL, showStudy);
      window.scrollTo(0, 0);
    }

    function showStaff() {
      clearStudy();
      setView('home'); // the staff grid reuses the home-view styling
      renderStaff(app, showStudy);
      window.scrollTo(0, 0);
    }

    // The default landing view: boxes linking to the grids (?learn), the
    // shared overview (?shared), and the staff cards (?staff). The student
    // boxes only show for viewers with students of their own (CTX.hasOwn) —
    // everyone else gets just the staff box, plus a pointer for teachers who
    // should have sections.
    function showMenu() {
      clearStudy();
      setView('menu');
      app.innerHTML = '';
      var menu = el('div');
      menu.id = 'menu';
      menu.appendChild(el('h1', null, 'Facecards'));
      var boxes = el('div', 'menu-boxes');
      if (CTX.hasOwn) {
        boxes.appendChild(menuBox('Learn students’ names', '?learn'));
        boxes.appendChild(menuBox('See shared students', '?shared'));
      }
      boxes.appendChild(menuBox('Learn staff names', '?staff'));
      menu.appendChild(boxes);

      if (!CTX.hasOwn) {
        var note = el('p', 'menu-note', 'Have students of your own to learn? Contact Mr. Seibel ');
        var mail = el('a', null, 'peterseibel@berkeley.net');
        mail.href = 'mailto:peterseibel@berkeley.net';
        note.appendChild(mail);
        note.appendChild(document.createTextNode(' to get your classes set up.'));
        menu.appendChild(note);
      }

      // QR code to the app URL, so it's easy to open on a phone without typing
      // the long /exec URL.
      if (CTX.baseUrl) {
        var qr = el('div', 'menu-qr');
        var img = el('img');
        img.alt = 'QR code to open Facecards on your phone';
        img.src =
          'https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data=' +
          encodeURIComponent(CTX.baseUrl);
        qr.appendChild(img);
        qr.appendChild(el('p', null, 'Scan to open on your phone'));
        menu.appendChild(qr);
      }

      app.appendChild(menu);
      window.scrollTo(0, 0);
    }

    function menuBox(label, query) {
      var box = el('a', 'menu-box', label);
      box.href = appUrl(query);
      if (CTX.baseUrl) box.target = '_top';
      return box;
    }

    function studentsFor(scope, id) {
      if (scope === 'staff') {
        return staffMatches(); // the staff view's filter narrows study too
      }
      if (scope === 'class' && MODEL.classes[id]) {
        return MODEL.classes[id].students.slice();
      }
      if (scope === 'list' && MODEL.lists && MODEL.lists[id]) {
        return MODEL.lists[id].students.slice();
      }
      var all = [];
      Object.keys(MODEL.classes).forEach(function (slug) {
        all = all.concat(MODEL.classes[slug].students);
      });
      return all;
    }

    function titleFor(mode, scope, id) {
      if (scope === 'staff') {
        var q = staffFilterQuery.trim();
        return q ? 'Staff matching “' + q + '”' : 'BHS staff';
      }
      if (scope === 'class' && MODEL.classes[id]) {
        return MODEL.classes[id].name;
      }
      if (scope === 'list' && MODEL.lists && MODEL.lists[id]) {
        return MODEL.lists[id].name;
      }
      return 'All my students';
    }

    // A card's identity across sessions, for saved progress: students by
    // student number, staff by canonical email (with a name fallback for the
    // odd directory row with no email).
    function cardKey(scope, s) {
      if (scope === 'staff') return s.email || s.firstName + ' ' + s.lastName;
      return s.studentNumber;
    }

    // Saved deck progress: the keys of the cards the viewer has retired, in
    // localStorage so it survives reloads — big decks (all staff) take many
    // sittings. Keyed by viewer + mode + deck; the staff filter is
    // deliberately not part of the key, so staff retired while studying one
    // filter stay retired under any other. Best-effort only: the sandbox
    // origin (script.googleusercontent.com) can change over time, and some
    // browsers block storage in the iframe entirely — then study just starts
    // fresh every time, as before.
    function progressKey(mode, scope, id) {
      return 'facecards:' + (CTX.effective || '') + ':' + mode + ':' + scope + ':' + (id || '');
    }

    function loadRetired(key) {
      try {
        return JSON.parse(localStorage.getItem(key)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveRetired(key, keys) {
      try {
        localStorage.setItem(key, JSON.stringify(keys));
      } catch (e) {
        /* storage blocked or full — progress just isn't saved */
      }
    }

    // missed, if given, is a subset of the deck's students (the ones missed
    // in the session that just ended): study those instead, as a one-off
    // drill that neither restores nor writes the deck's saved progress.
    function showStudy(mode, scope, id, missed) {
      clearStudy();
      var students = missed || studentsFor(scope, id);
      // Staff flashcards are the face: with no photo there's nothing to
      // learn, so Learn and Review leave out photo-less staff — and the
      // viewer's own card, since nobody needs to learn their own name.
      // (Browse keeps everyone — it's for reading the directory, not
      // quizzing.)
      if (scope === 'staff' && mode !== 'browse') {
        var self = String(CTX.effective || '').toLowerCase();
        students = students.filter(function (p) {
          return p.photoUrl && String(p.email || '').toLowerCase() !== self;
        });
      }
      if (!students.length) {
        if (scope === 'staff') showStaff(); // the filter matched nobody studyable
        else showHome(); // deep link to a class the viewer doesn't teach, etc.
        return;
      }

      // Browse: the same one-at-a-time cards, but with the info always showing
      // and swipe/arrow navigation instead of a flashcard session.
      if (mode === 'browse') {
        setView('browse');
        teardownStudy =
          scope === 'staff'
            ? renderStaffBrowse(app, titleFor(mode, scope, id), students)
            : renderBrowse(app, titleFor(mode, scope, id), students);
        window.scrollTo(0, 0);
        return;
      }

      setView('study');
      app.innerHTML = '';

      var header = el('h1');
      header.id = 'study-header';
      header.textContent = titleFor(mode, scope, id) + (missed ? ' — missed' : '');

      var current = el('div');
      current.id = 'current';

      app.appendChild(header);
      app.appendChild(current);

      var cards = students.map(function (s) {
        if (scope === 'staff') return buildStaffCard(s);
        // hideClass: list students have no single course/period of the viewer's.
        return buildCard(s, {
          showNumber: false,
          nameWithFirst: true,
          defer: true,
          hideClass: scope === 'list',
        });
      });

      var state = mode === 'learn' ? new LearnState(cards) : new ReviewState(cards);

      // Restore saved progress: cards retired in an earlier session start
      // graduated. The saved set may hold keys outside this deck (a
      // different staff filter) — those are kept, untouched, on every save.
      // A missed drill has no storeKey: it starts fresh and saves nothing.
      var storeKey = missed ? null : progressKey(mode, scope, id);
      var keys = new Map(); // card element -> stable identity
      var byCard = new Map(); // card element -> its student, for missed drills
      cards.forEach(function (card, i) {
        keys.set(card, cardKey(scope, students[i]));
        byCard.set(card, students[i]);
      });
      var retired = new Set(storeKey ? loadRetired(storeKey) : []);
      cards.forEach(function (card) {
        if (retired.has(keys.get(card))) state.restore(card);
      });

      teardownStudy = runStudy(state, current, {
        onAnswer: storeKey
          ? function () {
              // Re-sync this deck's cards into the saved set (a miss can
              // un-retire a card, so removal matters as much as addition).
              cards.forEach(function (card) {
                if (state.graduated.indexOf(card) !== -1) retired.add(keys.get(card));
                else retired.delete(keys.get(card));
              });
              saveRetired(storeKey, Array.from(retired));
            }
          : null,
        onRestart: function () {
          if (storeKey) {
            cards.forEach(function (card) {
              retired.delete(keys.get(card));
            });
            saveRetired(storeKey, Array.from(retired));
          }
          showStudy(mode, scope, id, missed); // same set, same mode, fresh state
        },
        restartLabel: mode === 'review' ? 'Review again' : 'Learn again',
        onStudyMissed: function (newMode, missedCards) {
          showStudy(
            newMode,
            scope,
            id,
            missedCards.map(function (card) {
              return byCard.get(card);
            }),
          );
        },
      });
      if (scope === 'staff') {
        preloadStaffPhotos(students);
      } else {
        preloadPhotos(
          students.map(function (s) {
            return s.fileId;
          }),
        );
      }
      window.scrollTo(0, 0);
    }

    function renderBanner() {
      if (!banner) return;
      banner.innerHTML = '';
      var base = CTX.baseUrl || '';

      // Nav links. Mine and Shared only make sense for viewers with students
      // of their own; everyone gets Home and Staff. appUrl keeps ?as= so
      // impersonation survives the full-page reload.
      var nav = el('div', 'nav-links');
      nav.appendChild(navLink('Home', appUrl('')));
      if (CTX.hasOwn) {
        nav.appendChild(navLink('Mine', appUrl('?learn')));
        nav.appendChild(navLink('Shared', appUrl('?shared')));
      }
      nav.appendChild(navLink('Staff', appUrl('?staff')));
      banner.appendChild(nav);

      var help = el('button', 'nav-help', '?');
      help.type = 'button';
      help.setAttribute('aria-label', 'How to use the flashcards');
      help.addEventListener('click', openHelp);
      banner.appendChild(help);

      // Owner-only: replace the roster / counselor mapping from a CSV export.
      if (CTX.isOwner) {
        Object.keys(UPLOADS).forEach(function (kind) {
          var cfg = UPLOADS[kind];
          var btn = el('button', 'nav-roster', cfg.label);
          btn.type = 'button';
          btn.setAttribute('aria-label', cfg.title);
          btn.addEventListener('click', function () {
            openUpload(kind);
          });
          banner.appendChild(btn);
        });
      }

      // Impersonation notice — admins viewing as someone else.
      if (CTX.impersonating) {
        banner.appendChild(el('span', 'nav-note', 'as ' + CTX.effective.replace(/@berkeley\.net$/, '')));
        if (base) {
          var backLink = el('a', null, 'back to me');
          backLink.href = base;
          backLink.target = '_top';
          banner.appendChild(backLink);
        }
      }

      if (CTX.isAdmin && CTX.baseUrl) {
        var form = document.createElement('form');
        form.action = CTX.baseUrl;
        form.method = 'get';
        form.target = '_top';
        var input = document.createElement('input');
        input.name = 'as';
        input.type = 'text';
        input.placeholder = 'view as…';
        input.setAttribute('aria-label', 'View as user');
        input.required = true;
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            if (form.requestSubmit) form.requestSubmit();
            else form.submit();
          }
        });
        form.appendChild(input);
        form.appendChild(el('button', null, 'Go'));
        banner.appendChild(form);
      }
    }

    function navLink(label, href) {
      var a = el('a', 'nav-link', label);
      a.href = href || '#';
      if (CTX.baseUrl) a.target = '_top';
      return a;
    }

    // Owner-only: the navbar Roster / Counselors buttons open a modal for
    // uploading a fresh export, which replaces the corresponding tab
    // server-side (uploadRoster / uploadCounselors — both validate before
    // touching the tab). Built lazily on first open; only the owner ever
    // gets the buttons. (The UPLOADS configs live near the top of this file
    // because renderBanner reads them at startup.)
    var uploadOverlays = {};
    function openUpload(kind) {
      if (!uploadOverlays[kind]) {
        uploadOverlays[kind] = buildUploadOverlay(UPLOADS[kind]);
        document.body.appendChild(uploadOverlays[kind]);
      }
      uploadOverlays[kind].classList.add('show');
    }

    function buildUploadOverlay(cfg) {
      // Reuses the help overlay's chrome (and thereby helpOpen()'s guard, so
      // keys and taps aimed at the modal can't drive a study session behind it).
      var overlay = el('div', 'help-overlay');
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) overlay.classList.remove('show');
      });
      window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') overlay.classList.remove('show');
      });

      var box = el('div', 'help-box roster-box');
      var close = el('button', 'help-close', '×');
      close.type = 'button';
      close.setAttribute('aria-label', 'Close');
      close.addEventListener('click', function () {
        overlay.classList.remove('show');
      });
      box.appendChild(close);
      box.appendChild(el('h2', null, cfg.title));
      box.appendChild(el('p', 'hint', cfg.hint));

      var form = el('form');
      var file = el('input');
      file.type = 'file';
      file.accept = '.csv,.tsv,text/csv,text/tab-separated-values';
      form.appendChild(file);

      var button = el('button', null, cfg.button);
      button.type = 'submit';
      form.appendChild(button);
      box.appendChild(form);

      var status = el('p', 'staff-status');
      box.appendChild(status);

      function setStatus(msg, isError) {
        status.textContent = msg;
        status.classList.toggle('error', !!isError);
      }

      function send(text) {
        button.disabled = true;
        setStatus('Uploading… (rewrites the tab and rebuilds the caches — can take a minute)');
        google.script.run
          .withSuccessHandler(function (result) {
            button.disabled = false;
            // In place, no navigation (the sandbox blocks non-gesture
            // navigation) — the reload link is a real click.
            setStatus(cfg.describe(result));
            var a = el('a', null, 'reload');
            a.href = appUrl('');
            if (CTX.baseUrl) a.target = '_top';
            status.appendChild(a);
            status.appendChild(document.createTextNode('.'));
          })
          .withFailureHandler(function (err) {
            button.disabled = false;
            setStatus(err.message, true);
          })
          [cfg.endpoint](text, asParam());
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!(file.files && file.files.length)) {
          setStatus('Choose an export file first.', true);
          return;
        }
        var reader = new FileReader();
        reader.onload = function () {
          send(String(reader.result));
        };
        reader.onerror = function () {
          setStatus('Could not read that file.', true);
        };
        reader.readAsText(file.files[0]);
      });

      overlay.appendChild(box);
      return overlay;
    }

    // A modal explaining how to study; opened by the navbar "?", closed by its ×
    // or by clicking the backdrop.
    function buildHelpOverlay() {
      var overlay = el('div', 'help-overlay');
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) overlay.classList.remove('show');
      });
      window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') overlay.classList.remove('show');
      });

      var box = el('div', 'help-box');
      var close = el('button', 'help-close', '×');
      close.type = 'button';
      close.setAttribute('aria-label', 'Close');
      close.addEventListener('click', function () {
        overlay.classList.remove('show');
      });
      box.appendChild(close);
      box.appendChild(el('h2', null, 'How to use Facecards'));
      box.appendChild(el('div', 'help-body')); // filled per platform on open
      overlay.appendChild(box);
      return overlay;
    }

    // Fill and open the help overlay, with instructions appropriate to the
    // device. Static markup only, so innerHTML is fine.
    function openHelp() {
      var mobile = isMobile();
      var reveal = mobile
        ? 'Tap the card to reveal the name. Then swipe right if you got it, or ' +
          'swipe left if you missed it.'
        : 'Press any key to reveal the name. Then press the right arrow key if you ' +
          'got it, or the left arrow key if you missed it.';
      helpOverlay.querySelector('.help-body').innerHTML =
        // Mine and Shared are hidden for viewers with no students of their
        // own, so the help skips them too.
        (CTX.hasOwn
          ? '<p><strong>Mine</strong> is for learning and browsing your own students</p>' +
            '<p><strong>Shared</strong> shows you the students you share with each of the ' +
            'other teachers.</p>'
          : '') +
        '<p><strong>Staff</strong> is for learning your colleagues’ names and faces ' +
        'with a filter to study just one department or role. If your own listing is wrong, ' +
        'contact <a href="mailto:peterseibel@berkeley.net">Peter Seibel</a> to get it fixed.</p>' +
        (CTX.hasOwn ? '<h2>On the Mine page</h2>' : '<h2>Studying the cards</h2>') +
        '<h3>Learn and Review</h3>' +
        '<p>' +
        reveal +
        ' Students with no picture available show as their initials.</p>' +
        '<p><strong>Learn</strong> uses spaced repetition: cards you miss come back ' +
        'right away, while cards you get come back less and less often until you’ve ' +
        'learned everyone.</p>' +
        '<p><strong>Review</strong> is a quicker check that you still remember ' +
        'everyone: get them all right and it’s a single pass, but anyone you ' +
        'miss drops back into the Learn schedule until you’ve relearned them.</p>' +
        '<p>The bar at the bottom shows how many cards you’ve fully learned. ' +
        'Progress is saved in the browser, so you can work across several ' +
        'sessions — <strong>Start over</strong> clears it and begins again.</p>' +
        '<h3>Browse</h3>' +
        '<p>Shows students or staff one at a time with all their information — ' +
        (mobile ? 'swipe left and right' : 'use the arrow keys') +
        ' to move between them.</p>' +
        // Custom lists are owner-only; MODEL.lists is absent for everyone else.
        (MODEL.lists
          ? '<h3>Custom lists</h3>' +
            '<p>You can also make your own lists to study: at the bottom of the Mine ' +
            'page, upload a text file of student numbers (one per line) — or paste ' +
            'them in. A .tsv works too: the first column is the student number and ' +
            'any other columns show on the back of the card. A list can include any ' +
            'students, not just your own.</p>'
          : '');
      helpOverlay.classList.add('show');
    }

    // Initial dispatch: a shared learn/review link lands straight in study mode;
    // ?shared-with= lands in the shared-students table.
    if (ROUTE.mode === 'shared') {
      clearStudy();
      if (isMobile()) {
        setView('shared-swipe');
        renderSharedSwipe(app, window.SHARED);
      } else {
        setView('shared');
        renderShared(app, window.SHARED);
      }
      window.scrollTo(0, 0);
    } else if (ROUTE.mode === 'shared-overview') {
      clearStudy();
      setView('shared'); // one table for all devices
      renderSharedOverview(app, window.SHARED);
      window.scrollTo(0, 0);
    } else if (ROUTE.mode === 'staff') {
      showStaff();
    } else if (
      ROUTE.mode === 'learn' ||
      ROUTE.mode === 'review' ||
      ROUTE.mode === 'browse'
    ) {
      showStudy(ROUTE.mode, ROUTE.scope || 'all', ROUTE.id || '');
    } else if (ROUTE.mode === 'grid') {
      showHome();
    } else {
      showMenu();
    }
  })();
</script>
