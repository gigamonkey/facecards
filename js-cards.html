<script>
  // Build the student photo-card DOM shared by the home grid and study modes.

  function thumbUrl(fileId, size) {
    return (
      'https://drive.google.com/thumbnail?id=' +
      encodeURIComponent(fileId) +
      '&sz=w' +
      (size || 400)
    );
  }

  // opts.nameWithFirst: nickname line reads "Nick (First)" (study view).
  // opts.showNumber:    append the student-number line (home view).
  // opts.hideClass:     omit the course/period line (shared views, where a
  //                     student spans several classes).
  // opts.defer:         don't load the photo yet — show a "Loading…" box that
  //                     loadCardImage swaps for the proxied photo when the card
  //                     is shown (study mode), so the answer stays hidden.
  // Mirrors views/index.njk and views/study.njk.
  function initials(s) {
    return ((s.firstName || '').charAt(0) + (s.lastName || '').charAt(0)).toUpperCase();
  }

  function buildCard(s, opts) {
    opts = opts || {};
    var card = el('div', 'card');

    if (!s.fileId) {
      card.appendChild(el('div', 'initials', initials(s))); // no photo → initials box
    } else if (opts.defer) {
      card.appendChild(loadingBox(s.fileId)); // study — swapped for the photo on show
    } else {
      var img = el('img');
      img.alt = (s.firstName || '') + ' ' + (s.lastName || '');
      img.loading = 'lazy';
      img.src = thumbUrl(s.fileId, 400);
      card.appendChild(img);
    }

    var back = el('div', 'back');
    var nameText = s.nickname
      ? opts.nameWithFirst
        ? s.nickname + ' (' + s.firstName + ')'
        : s.nickname
      : s.firstName;
    back.appendChild(el('p', 'name', nameText));
    back.appendChild(el('p', null, (s.firstName || '') + ' ' + (s.lastName || '')));
    back.appendChild(el('p', null, (s.grade || '') + ' / ' + (s.gender || '')));
    if (!opts.hideClass) {
      var period = 'Period ' + (s.period || '');
      back.appendChild(el('p', null, s.course ? s.course + ' - ' + period : period));
    }
    // Custom-list students can carry extra lines (the spare TSV columns).
    (s.extra || []).forEach(function (line) {
      back.appendChild(el('p', null, line));
    });
    if (opts.showNumber) back.appendChild(el('p', null, String(s.studentNumber)));
    card.appendChild(back);

    return card;
  }

  // A "Loading…" placeholder for a deferred photo; loadCardImage swaps it for
  // the real image once fetched.
  function loadingBox(fileId) {
    var box = el('div', 'loading', 'Loading…');
    box.dataset.fileid = fileId;
    return box;
  }

  // Photos fetched through the script are held in memory by fileId, so card
  // repeats (Learn re-asks, review re-runs) don't refetch within a session.
  var PHOTO_CACHE = {};

  function hasServer() {
    return typeof google !== 'undefined' && google.script && google.script.run;
  }

  // --- Direct-vs-proxied photo detection -----------------------------------
  //
  // Direct Drive thumbnail loads work on desktop but are blocked where the
  // browser won't send Google's cookie to drive.google.com (notably Safari on
  // mobile, which strips third-party cookies), so a domain-restricted photo
  // 403s and the <img> fires `error`. We probe once with a real thumbnail: if
  // it loads, study/shared cards reuse the same direct URLs the grid already
  // cached (so they appear instantly); if it errors, they fall back to fetching
  // photos through the server (getPhoto), which always works.
  var DIRECT_OK = null; // null until the probe resolves
  var directWaiters = [];
  var directProbed = false;

  function settleDirect(ok) {
    DIRECT_OK = ok;
    var waiters = directWaiters;
    directWaiters = [];
    waiters.forEach(function (cb) {
      cb(ok);
    });
  }

  // Run cb(DIRECT_OK) once known — immediately if the probe already resolved.
  function whenDirectKnown(cb) {
    if (DIRECT_OK !== null) cb(DIRECT_OK);
    else directWaiters.push(cb);
  }

  // The first real photo in the injected model, to probe with.
  function anyFileId() {
    var m = window.MODEL;
    if (m && m.classes) {
      var slugs = Object.keys(m.classes);
      for (var i = 0; i < slugs.length; i++) {
        var studs = m.classes[slugs[i]].students || [];
        for (var j = 0; j < studs.length; j++) {
          if (studs[j].fileId) return studs[j].fileId;
        }
      }
    }
    var sh = window.SHARED;
    if (sh && sh.students) {
      for (var k = 0; k < sh.students.length; k++) {
        if (sh.students[k].fileId) return sh.students[k].fileId;
      }
    }
    return null;
  }

  // Kick off the probe once (idempotent). Uses the same URL/size the grid uses
  // so on the grid path it's a cache hit and resolves instantly.
  function startDirectProbe() {
    if (directProbed) return;
    directProbed = true;
    var fileId = anyFileId();
    if (!fileId) {
      settleDirect(false); // no photos → nothing to reuse, don't leave waiters hung
      return;
    }
    var probe = new Image();
    probe.onload = function () {
      settleDirect(true);
    };
    probe.onerror = function () {
      settleDirect(false);
    };
    probe.src = thumbUrl(fileId, 400);
  }

  // Fetch a photo through the server as a data URL and hand it to swap(). Cached
  // by fileId so card repeats (Learn re-asks, review re-runs) don't refetch.
  function proxyLoad(fileId, swap) {
    if (PHOTO_CACHE[fileId]) {
      var cached = el('img');
      cached.src = PHOTO_CACHE[fileId];
      swap(cached);
      return;
    }
    if (!hasServer()) return;
    google.script.run
      .withSuccessHandler(function (dataUrl) {
        if (!dataUrl) return;
        PHOTO_CACHE[fileId] = dataUrl;
        var img = el('img');
        img.src = dataUrl;
        swap(img);
      })
      .getPhoto(fileId);
  }

  // When a deferred card is shown, replace its "Loading…" box with the photo.
  // Where direct Drive loads work, use the same URL the grid cached (instant),
  // falling back to the proxy if that particular image fails; otherwise proxy
  // straight away.
  function loadCardImage(card) {
    if (!card) return;
    var box = card.querySelector('.loading');
    if (!box || !box.dataset || !box.dataset.fileid) return;
    var fileId = box.dataset.fileid;
    delete box.dataset.fileid;

    function swap(node) {
      if (!node || !box.parentNode) return;
      box.parentNode.replaceChild(node, box);
    }

    // Already have a proxied copy from a previous show/preload.
    if (PHOTO_CACHE[fileId]) {
      proxyLoad(fileId, swap);
      return;
    }

    whenDirectKnown(function (ok) {
      if (!box.parentNode) return; // card left the DOM before the probe resolved
      if (!ok) {
        proxyLoad(fileId, swap);
        return;
      }
      // Keep the "Loading…" box until the direct image is ready so a failure
      // (probe passed but this file didn't) falls back cleanly to the proxy.
      var img = el('img');
      img.onload = function () {
        img.onload = null;
        swap(img);
      };
      img.onerror = function () {
        img.onerror = null;
        proxyLoad(fileId, swap);
      };
      img.src = thumbUrl(fileId, 400);
      // Warmed already → resolve synchronously, no "Loading…" flash.
      if (img.complete && img.naturalWidth) {
        img.onload = null;
        swap(img);
      }
    });
  }

  // Direct-loaded images, kept referenced for the whole session. Retaining
  // the Image objects does two things a fire-and-forget `new Image().src` can't:
  // it stops the browser from garbage-collecting (and so cancelling) a preload
  // whose request is still queued, and it keeps the decoded photo in the memory
  // cache so a first view deep into the session paints instantly instead of
  // re-fetching an image whose HTTP-cache entry didn't survive. Keyed by URL
  // (Drive thumbnail URLs and the staff directory's public photo URLs alike).
  // The images are small and the sets bounded, so holding them is cheap.
  var DIRECT_WARM = {};

  // Warm the browser cache for direct loads, at most POOL requests in flight so
  // a big set doesn't fire hundreds of requests at once.
  function warmUrls(urls, pool) {
    var i = 0;
    var active = 0;
    function pump() {
      while (active < pool && i < urls.length) {
        var url = urls[i++];
        if (!url || DIRECT_WARM[url]) continue;
        active++;
        var img = new Image();
        DIRECT_WARM[url] = img; // retain for the session
        img.onload = img.onerror = function () {
          active--;
          pump();
        };
        img.src = url;
      }
    }
    pump();
  }

  // Warm photos in the background so cards are usually ready before they're
  // reached: browser cache when direct loads work (the grid often did this
  // already), otherwise the proxy cache. Both paths keep a few requests in
  // flight at once (POOL) — faster than serial, still bounded (the proxy path so
  // it doesn't overrun Apps Script's simultaneous-execution limit; the direct
  // path so it doesn't burst hundreds of Drive requests).
  var PRELOAD_POOL = 4;
  var DIRECT_POOL = 6; // browsers cap ~6 connections per host anyway

  function preloadPhotos(fileIds) {
    whenDirectKnown(function (ok) {
      if (ok) {
        warmUrls(
          fileIds.map(function (fileId) {
            return fileId && thumbUrl(fileId, 400);
          }),
          DIRECT_POOL,
        );
        return;
      }
      if (!hasServer()) return;
      var i = 0;
      // Start the next unwarmed photo, then chain the following one from its
      // completion. Primed POOL times below, this keeps ~POOL requests in flight.
      function pump() {
        while (i < fileIds.length && (!fileIds[i] || PHOTO_CACHE[fileIds[i]])) i++;
        if (i >= fileIds.length) return;
        var fileId = fileIds[i++];
        google.script.run
          .withSuccessHandler(function (dataUrl) {
            if (dataUrl) PHOTO_CACHE[fileId] = dataUrl;
            pump();
          })
          .withFailureHandler(function () {
            pump();
          })
          .getPhoto(fileId);
      }
      for (var n = 0; n < PRELOAD_POOL; n++) pump();
    });
  }

  startDirectProbe();
</script>
