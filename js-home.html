<script>
  // Render the home view: the viewer's classes as photo-card grids, with
  // learn/review/browse links per class and for all of their students. Port of
  // views/index.njk (minus the outer per-teacher loop — it's one teacher).

  function renderHome(container, model, onStudy) {
    container.innerHTML = '';
    var home = el('div');
    home.id = 'home';

    // Teacher name (hidden on mobile via CSS).
    home.appendChild(el('h1', 'teacher-name', model.teacherLast || 'My students'));

    Object.keys(model.classes).forEach(function (slug) {
      var c = model.classes[slug];

      home.appendChild(classHead(c.name, onStudy, 'class', slug));

      var faces = el('div', 'faces');
      c.students
        .slice()
        .sort(function (a, b) {
          return String(a.firstName).localeCompare(String(b.firstName));
        })
        .forEach(function (s) {
          var card = buildCard(s, { showNumber: true, nameWithFirst: false });
          attachFlip(card);
          faces.appendChild(card);
        });
      home.appendChild(faces);
    });

    home.appendChild(classHead('All students', onStudy, 'all', ''));

    container.appendChild(home);
  }

  // A class heading with its Learn/Review/Browse buttons — on one row (desktop)
  // or stacked (mobile), controlled by CSS.
  function classHead(name, onStudy, scope, id) {
    var head = el('div', 'class-head');
    head.appendChild(el('h2', null, name));
    head.appendChild(buttonsRow(onStudy, scope, id));
    return head;
  }

  // The Learn/Review/Browse buttons for a study scope.
  function buttonsRow(onStudy, scope, id) {
    var div = el('div', 'buttons');
    ['learn', 'review', 'browse'].forEach(function (mode) {
      div.appendChild(
        studyLink(mode.charAt(0).toUpperCase() + mode.slice(1), function () {
          onStudy(mode, scope, id);
        }),
      );
    });
    return div;
  }

  // Render the browse view: the scope's students one at a time like Learn and
  // Review, but with the info always showing — swipe (or arrow keys) to move
  // between students, like the shared-students carousel whose machinery and CSS
  // it reuses. Returns the carousel's teardown (it hooks document-level
  // listeners) for the controller to run on leaving the view.
  function renderBrowse(container, title, students) {
    container.innerHTML = '';
    var wrap = el('div');
    wrap.id = 'browse';
    wrap.appendChild(el('h1', null, title));

    var cards = students
      .slice()
      .sort(function (a, b) {
        return String(a.firstName).localeCompare(String(b.firstName));
      })
      .map(buildBrowseCard);

    var teardown = runCarousel(wrap, cards);
    preloadPhotos(
      students.map(function (s) {
        return s.fileId;
      }),
    );
    container.appendChild(wrap);
    return teardown;
  }

  // A carousel card for browse: photo above the student's info (which, unlike a
  // flashcard, is always visible).
  function buildBrowseCard(s) {
    var card = el('div', 'swipe-card');

    if (!s.fileId) {
      card.appendChild(el('div', 'initials', initials(s)));
    } else {
      card.appendChild(loadingBox(s.fileId)); // loaded direct-or-proxied when shown
    }

    var info = el('div', 'swipe-info');
    info.appendChild(
      el('p', 'name', s.nickname ? s.nickname + ' (' + s.firstName + ')' : s.firstName),
    );
    info.appendChild(el('p', null, (s.firstName || '') + ' ' + (s.lastName || '')));
    info.appendChild(el('p', null, (s.grade || '') + ' / ' + (s.gender || '')));
    info.appendChild(el('p', null, (s.course || '') + ' - Period ' + (s.period || '')));
    info.appendChild(el('p', null, String(s.studentNumber)));
    card.appendChild(info);

    return card;
  }

  function studyLink(text, handler) {
    var a = el('a', null, text);
    a.href = '#';
    a.addEventListener('click', function (e) {
      e.preventDefault();
      handler();
    });
    return a;
  }

  // Flip a card between its front (photo or initials box) and info on click
  // (port of public/js/index.js).
  function attachFlip(card) {
    card.dataset.showing = 'front';
    var front = card.querySelector('img') || card.querySelector('.initials');
    var back = card.querySelector('.back');
    card.onclick = function () {
      if (card.dataset.showing === 'front') {
        front.style.display = 'none';
        back.style.display = 'flex';
        card.dataset.showing = 'back';
      } else {
        front.style.display = ''; // revert to the CSS default (block img / flex initials)
        back.style.display = 'none';
        card.dataset.showing = 'front';
      }
    };
  }
</script>
