<script>
  // Return a shuffled copy without disturbing the original (from
  // public/js/random.js).
  function shuffled(orig) {
    var array = Array.prototype.slice.call(orig);
    for (var i = array.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = array[i];
      array[i] = array[j];
      array[j] = tmp;
    }
    return array;
  }
</script>
